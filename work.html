<style>
/* ======================================================
   ROOT TOKENS
   Inherits the same visual language as index.html so the
   site reads as one coherent piece. Edit values here only
   if the homepage tokens change.
====================================================== */
:root {
  --bg:           #0C0B09;
  --bg-2:         #161513;
  --fg:           #F4F1EB;
  --fg-dim:       #D9D5CC;
  --muted:        #8A867D;
  --accent-warm:  #C8B69A;

  /* Horizontal gutter for tile gaps and section padding. Matches
     the homepage exactly so the work page feels continuous with the
     rest of the site. */
  --edge:        clamp(8px, 1vw, 14px);

  /* Nav gutter — wider than --edge so the nav contents sit comfortably
     in from the page edges. */
  --nav-edge:    clamp(16px, 1.8vw, 28px);

  --radius:      clamp(8px, 0.9vw, 14px);
  --nav-h:       64px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-feature-settings: "ss01", "cv11";
  margin: 0;
  padding: 0;
  /* No overflow-x:hidden here. That CSS property creates a new
     scroll context on the root, which silently breaks
     position:sticky against the page scroll. If horizontal
     overflow ever needs to be tamed, do it on a non-ancestor
     wrapper of the sticky elements, or use overflow-x:clip
     (which doesn't break sticky). */
}

body {
  /* The page cover fades on load to mask reflow. Mirrors the
     homepage handoff so navigation between pages feels continuous. */
}

a { color: inherit; text-decoration: none; }

/* ======================================================
   NAV — flat horizontal menu
   Brand on the left (name + role tagline that appears on hover).
   Flat horizontal nav on the right: Home / Work / About / Contact.
   No collapsible menu, no burger. The functional elements are
   visible at all times because top-tier director sites do not
   hide their navigation on desktop.
====================================================== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--nav-edge);
  pointer-events: none;
}
.nav > * { pointer-events: auto; }

/* Brand — same DOM and styles as the homepage so the upper-left
   identity is identical between pages. */
.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
}

/* ===== WORK PAGE INTRO =====
   On load the full-bleed first tile shows first; then the MIKE BECKER
   wordmark descends from the top; then the active section title (Director)
   fades in. Two body classes hold each piece until JS lifts them on a
   timer after the page cover drops. */
.brand {
  transition: transform 860ms cubic-bezier(.22,.61,.36,1), opacity 720ms ease;
}
body.wk-hold-nav .brand { transform: translateY(-46px); opacity: 0; }
body.wk-hold-nav .m-burger { opacity: 0; }
body.wk-hold-label .work-section-label,
body.wk-hold-label .work-label-sticky { opacity: 0 !important; }
/* During the intro reveal only, give the title a one-time fade-in; JS
   removes this right after so the scroll-linked opacity stays instant. */
body.wk-intro-fade .work-section-label,
body.wk-intro-fade .work-label-sticky { transition: opacity 620ms ease; }
@media (prefers-reduced-motion: reduce) {
  .brand { transition: none; }
  body.wk-hold-nav .brand { transform: none; opacity: 1; }
  body.wk-hold-nav .m-burger { opacity: 1; }
}
.brand-name {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 32;
  font-weight: 600;
  /* Matches the homepage's small nav brand exactly. */
  font-size: clamp(18px, 1.4vw, 22px);
  letter-spacing: 0.01em;
  line-height: 1;
  text-transform: uppercase;
}
/* brand-sub hidden — no hover reveal next to the wordmark. */
.brand-sub {
  display: none;
}
.brand-sub-bracket,
.brand-sub-dot {
  opacity: 0.55;
}

/* Flat nav — premium typographic menu, no toggle. Each item is
   small caps, wide tracking, with slashes between to echo the
   bracketed brand-sub typography. The current-page item gets
   full white; others sit at a slightly muted opacity. */
.menu-flat {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
}
.menu-flat-link {
  font-family: 'Inter', sans-serif;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  line-height: 1;
  color: rgba(255,255,255,0.72);
  transition: color 240ms cubic-bezier(.22,.61,.36,1);
  padding: 4px 2px;
}
.menu-flat-link:hover { color: #fff; }
.menu-flat-link.is-current { color: #fff; }
.menu-flat-sep {
  font-family: 'Inter', sans-serif;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: 400;
  color: rgba(255,255,255,0.4);
  line-height: 1;
}

/* ======================================================
   PAGE COVER — fades out on load to mask any reflow during
   font loading and content injection.
====================================================== */
.page-cover {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 400;
  pointer-events: none;
  opacity: 1;
  transition: opacity 520ms cubic-bezier(.22,.61,.36,1);
}
.page-cover.gone { opacity: 0; }

/* ======================================================
   WORK PAGE
   Grid of project thumbnails, grouped into sections by role.

   Each section has a sticky role label (Director, Cinematographer,
   Specialty Camera) that sits in the upper-right of the viewport,
   below the nav. The label appears as you scroll into a section,
   stays sticky over that section's tiles, then fades out and
   travels up with the section as it leaves the viewport. The next
   section's label fades in as that section enters. Pattern adapted
   from director / commercial roster sites (Park Pictures and
   similar) where the persistent label tells the viewer what role
   was played across everything currently in view.

   Within each section, tiles default to 16:9 standard tiles that
   pair 2-up. Tiles marked WIDE=true in site.txt span the full
   width of the section as a 2.39:1 cinemascope frame. The user
   curates the rhythm by deciding which tiles are wide.
====================================================== */
.work-main {
  /* No padding-top. The nav is fixed and floats over the content
     with text shadows for legibility — same treatment as the
     homepage hero. The first section's hero tile starts at y=0
     and the nav reads on top of it. */
  padding-bottom: clamp(60px, 8vw, 120px);
}

.work-section {
  position: relative;
  margin-top: var(--edge);
  /* No isolation, no z-index. The section stays in the root
     stacking context so that the labels (appended in a sibling
     layer after all sections) can blend with this section's
     tiles via mix-blend-mode. */
}
/* The first section sits flush against the top of the viewport
   so its hero tile extends behind the floating nav. */
.work-section:first-child {
  margin-top: 0;
}

/* The labels layer is a non-positioned wrapper inserted as the
   LAST child of <main>, after every section. Because it isn't
   positioned and has no isolation, it does NOT create a stacking
   context, and its children share the root stacking context with
   the section tiles. This is the property that makes
   mix-blend-mode actually invert tile pixels behind the text. */
.work-labels-layer {
  /* Intentionally empty — no positioning, no isolation. */
}

/* Each label is positioned against the VIEWPORT (position: fixed)
   with its top set per scroll frame by JS. The label is appended
   to the end of <main>, after every section, so in tree order it
   paints LAST in the root stacking context's step 6 — on top of
   every tile, regardless of section structure. There is no
   z-index, no isolation, and no stacking-context-creating ancestor
   above it, so mix-blend-mode: difference blends the white text
   against the composited tile pixels in the root context's
   backdrop. The result: legible white-on-dark, dark-on-light text
   that adapts continuously over varied imagery, never hidden
   behind a tile.

   JS positions the label so that:
   - When the section's bounds contain the viewport center, the
     label is centered vertically on 50vh.
   - When the section is leaving up top, the label tracks the
     section's bottom edge (label bottom = section bottom), so it
     never dips below the section.
   - When the section is entering from below, the label sits at
     the section's top edge.
   - When the section is fully out of viewport, opacity drops to 0. */
.work-section-label {
  position: fixed;
  z-index: 40;
  /* Slightly further from the edge than the nav (which uses --nav-edge
     at clamp(16px, 1.8vw, 28px)). The label gets its own inset so it
     can breathe without changing nav alignment. */
  left: clamp(24px, 2.8vw, 44px);
  /* top is set by JS each frame */
  display: inline-block;
  font-family: 'Inter', sans-serif;
  /* A small step up in size — was clamp(18, 2vw, 28). */
  font-size: clamp(22px, 2.4vw, 34px);
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #fff;
  line-height: 1;
  white-space: nowrap;
  mix-blend-mode: difference;
  pointer-events: none;
  opacity: 0;
  filter: blur(8px);
  /* The filter (blur) is set inline by JS each scroll frame as a
     continuous function of scroll position. We deliberately leave
     no time-based CSS transition on filter — the cross-fade should
     follow the scroll exactly, not run on its own clock. Stop the
     scroll and the cross-fade stops in place. Only opacity has a
     time-based transition (for fade in/out when a section enters
     or leaves the viewport). */
  /* Both opacity and blur are driven continuously by JS from the scroll
     position (see wireStickyLabels), so the cross-fade follows the scroll
     exactly rather than running on its own clock — no time-based transition
     here. Only `top` is listed (instant) to keep the position glued to the
     scroll frame too. */
  transition: top 0s;
  will-change: opacity, filter, top;
}

/* Mobile-only sticky section title. Hidden by default (desktop uses the
   floating fixed-layer title above). */
.work-label-sticky { display: none; }

/* The grid within a section. On desktop we use a 12-column grid
   so each section can compose its own rhythm. Every row is always
   filled completely by equal-width tiles, so the tile-to-tile gaps
   stay consistent everywhere. Creative variation comes from row
   composition (hero, pair, trio, banner) and aspect ratios — not
   from leaving empty grid space. */
.work-grid {
  display: grid;
  gap: var(--edge);
  padding: 0 var(--edge);
  grid-template-columns: 1fr;
}
@media (min-width: 760px) {
  .work-grid { grid-template-columns: repeat(12, 1fr); }
}

.work-grid .tile {
  position: relative;
  display: block;
  overflow: hidden;
  background: var(--bg-2);
  border-radius: var(--radius);
  cursor: pointer;
}
.work-grid .tile-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

@media (min-width: 760px) {
  /* Default tile (no class): half-width, 16:9. Same as is-half;
     declared so legacy markup keeps rendering correctly. */
  .work-grid .tile { grid-column: span 6; }

  /* Hero: full row, 2.39:1 cinemascope.
     The single largest piece in a section. First tile of every
     section is a hero. Sets up the dramatic anchor. */
  .work-grid .tile.is-hero,
  .work-grid .tile.is-wide {
    grid-column: 1 / -1;
  }
  .work-grid .tile.is-hero .tile-media,
  .work-grid .tile.is-wide .tile-media {
    aspect-ratio: 2.39 / 1;
  }

  /* Cluster system. Below the hero, every section has one row of
     three tiles forming a [half + small + small] cluster, with the
     half tile positioned differently per section so each section's
     row 2 has a distinct silhouette. Heights match exactly because
     a 6-col tile at 16:9 and a 3-col tile at 8:9 produce the same
     rendered height (0.281 of the grid width).

       is-half:  6 cols, 16:9 — the anchor of the cluster row.
                 Full 16:9 frame, no cropping. Goes to the strongest
                 non-hero piece in the section.
       is-small: 3 cols, 8:9 — supporting accent tiles. The 16:9
                 source video crops to roughly the center 50%
                 horizontally via object-fit: cover. Best suited
                 to centered subjects, close-ups, or compositions
                 that don't need the full frame to read. */
  .work-grid .tile.is-half {
    grid-column: span 6;
  }
  .work-grid .tile.is-half .tile-media {
    aspect-ratio: 16 / 9;
  }
  .work-grid .tile.is-small {
    grid-column: span 3;
  }
  .work-grid .tile.is-small .tile-media {
    aspect-ratio: 8 / 9;
  }

  /* CRACKED runs ~30% wider than a standard is-small (span 3 -> 4), paired
     with an is-half-narrow beside it (span 6 -> 5) so the cluster row still
     totals 12 columns and all three tiles keep the same height (3.375
     col-units). Aspects are width/height in col-units: 4/3.375 = 1.185 and
     5/3.375 = 1.481. */
  .work-grid .tile.is-small-wide {
    grid-column: span 4;
  }
  .work-grid .tile.is-small-wide .tile-media {
    aspect-ratio: 1.185 / 1;
  }
  .work-grid .tile.is-half-narrow {
    grid-column: span 5;
  }
  .work-grid .tile.is-half-narrow .tile-media {
    aspect-ratio: 1.481 / 1;
  }

  /* 2/3 + 1/3 asymmetric pair. Used in single-row layouts where
     two pieces sit beside each other at varied sizes. Heights
     match exactly: 8 cols at 9/16 aspect = 4 cols at 9/8 aspect.
     The 4-col tile's 16:9 source video crops to roughly the
     center 50% horizontally via object-fit: cover. */
  .work-grid .tile.is-major {
    grid-column: span 8;
  }
  .work-grid .tile.is-major .tile-media {
    aspect-ratio: 16 / 9;
  }
  .work-grid .tile.is-minor {
    grid-column: span 4;
  }
  .work-grid .tile.is-minor .tile-media {
    aspect-ratio: 8 / 9;
  }

  /* 3/4 + 1/4 asymmetric pair used in the Director section.
     The 9-col tile keeps a full 16:9 landscape frame. The 3-col
     companion uses a 16:27 aspect (about 0.59, clearly taller
     than wide) so its rendered height matches the 9-col tile's
     height exactly — math: 9 cols at 9/16 = 3 cols at 27/16,
     so the row fills with no whitespace.

     The 3-col tile's 16:9 source video crops to roughly the
     center 33% horizontally via object-fit: cover. Pick content
     for the quarter slot accordingly: centered subjects or
     compositions that don't need their full horizontal frame
     to read. Wide landscapes lose most of their information. */
  .work-grid .tile.is-three-quarter {
    grid-column: span 9;
  }
  .work-grid .tile.is-three-quarter .tile-media {
    aspect-ratio: 16 / 9;
  }
  .work-grid .tile.is-quarter {
    grid-column: span 3;
  }
  .work-grid .tile.is-quarter .tile-media {
    aspect-ratio: 16 / 27;
  }
  /* The quarter tile is 16:27 portrait. Dark Virgin's thumbnail is
     pre-cropped to exactly 16:27, centered on the subject, so it fits
     the tile with no further cropping and the person stays centered. */
  .work-grid .tile.is-quarter .tile-media video {
    object-position: 50% 50%;
  }

  /* Square-pair row: a wide tile (8 cols) beside a near-square tile
     (4 cols). The square tile's media is 1.265:1 — about 15% wider
     than the previous 1.1:1. To keep heights matched and the row
     filled with no whitespace, the wide tile's aspect is set so its
     height equals the near-square's height.

     Near-square: 4 col-units wide, aspect 1.265:1 → height = 4/1.265
       = 3.162 col-units.
     Wide tile: 8 col-units wide → aspect 8/3.162 = 2.53:1.

     The wide tile's 16:9 source crops top/bottom via object-fit:
     cover; the near-square crops on the sides. Used for the Camera
     section's bottom row (Life Afloat + Already Famous). */
  .work-grid .tile.is-wide-mate {
    grid-column: span 8;
  }
  .work-grid .tile.is-wide-mate .tile-media {
    aspect-ratio: 2.53 / 1;
  }
  .work-grid .tile.is-square {
    grid-column: span 4;
  }
  .work-grid .tile.is-square .tile-media {
    aspect-ratio: 1.265 / 1;
  }
}

/* A section with only one tile auto-promotes that tile to a hero
   so it doesn't sit alone in a single half column. */
@media (min-width: 760px) {
  .work-grid:has(.tile:only-child) .tile {
    grid-column: 1 / -1;
  }
  .work-grid:has(.tile:only-child) .tile .tile-media {
    aspect-ratio: 2.39 / 1;
  }
}

/* Tile video / placeholder behavior — same as homepage. The
   video starts paused, autoplays muted on hover. Slight scale
   transform on the placeholder for a gentle hover-bloom. */
/* Tile poster — a small still JPG that fills the tile instantly and sits
   UNDER the video. The video paints on top once it has frames; until then
   (or if it never loads on slow data) the poster is what's visible, so a
   tile is never blank. Same overfill + cover as the video so they align. */
.tile-media .tile-poster {
  position: absolute;
  top: -1px; left: -1px; right: -1px; bottom: -1px;
  width: calc(100% + 2px); height: calc(100% + 2px);
  object-fit: cover;
  display: block;
}
.work-grid .tile.is-quarter .tile-media .tile-poster {
  object-position: 50% 50%;
}
.tile-media video {
  position: absolute;
  /* Overfill by 1px on every side to kill any sub-pixel rounding gap
     (the thin black strip that can appear at a tile edge). */
  top: -1px; left: -1px; right: -1px; bottom: -1px;
  width: calc(100% + 2px); height: calc(100% + 2px);
  object-fit: cover;
  display: block;
  transform: scale(1.02);
  transition: transform 700ms cubic-bezier(.22,.61,.36,1);
}
.tile:hover .tile-media video {
  transform: scale(1.0);
}

/* Tile overlay - title text floating over the lower-right of the
   tile, hidden by default and revealed on hover. The whole overlay
   (gradient scrim + title text) cross-fades together so when no
   tile is hovered the page is pure imagery; hovering any tile
   reveals that one project's title with its scrim. Position is
   lower-right per your direction, so it doesn't compete with the
   sticky section label in the upper-right corner. */
.tile-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: clamp(14px, 1.8vw, 24px) clamp(16px, 2vw, 28px);
  background: linear-gradient(to top, rgba(12,11,9,0.55) 0%, rgba(12,11,9,0) 100%);
  pointer-events: none;
  text-align: right;
  opacity: 0;
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1);
}
.tile:hover .tile-overlay {
  opacity: 1;
}
.tile-overlay-title {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 28;
  font-weight: 500;
  font-size: clamp(16px, 1.6vw, 24px);
  letter-spacing: -0.005em;
  line-height: 1;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4);
}

/* ======================================================
   LIGHTBOX — full-screen project player. Same DOM and
   behavior as the homepage so the click-into-project
   experience is identical across the site.
====================================================== */
.lightbox {
  position: fixed;
  inset: 0;
  /* Above the nav on every breakpoint. The mobile nav sits at z-index 410
     (so the wordmark/burger stay tappable over the menu overlay); the
     lightbox must cover it so its own close button isn't buried under the
     burger and the whole nav is hidden while a project plays. */
  z-index: 600;
  background: rgba(8, 7, 6, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1);
}
.lightbox[aria-hidden="false"] {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-frame {
  width: min(94vw, 1400px);
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 1.6vw, 24px);
}
.lightbox-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  color: #fff;
  font-family: 'Inter', sans-serif;
}
.lightbox-title {
  margin: 0;
  font-variation-settings: "opsz" 32;
  font-weight: 500;
  font-size: clamp(18px, 1.8vw, 26px);
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.lightbox-player {
  position: relative;
  width: 100%;
  background: #000;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius);
  overflow: hidden;
}
.lightbox-player video {
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}
/* Role credit (Director / Specialty / Camera) sits OUTSIDE the video,
   in the lower-right beneath the player — never over the footage or the
   native controls. The text is mapped through the same ROLE_LABEL table
   used by the section titles on the work page, so it always matches. */
.lightbox-foot {
  display: flex;
  justify-content: flex-end;
  width: 100%;
}
.lightbox-role {
  font-family: 'Inter', sans-serif;
  font-size: clamp(11px, 0.9vw, 13px);
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(244,241,235,0.75);
  pointer-events: none;
}

/* When the lightbox is open, fully hide the fixed nav (wordmark + burger)
   on every breakpoint so nothing shows behind the close X. The lightbox
   already sits at z-index 600 above the nav, but this also drops the
   nav from the tab order and keeps it from catching taps in the corner. */
body.lightbox-open .nav,
body.lightbox-open .m-veil,
body.lightbox-open .m-menu {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

.lightbox-close {
  position: absolute;
  top: clamp(14px, 1.6vw, 22px);
  right: clamp(14px, 1.6vw, 22px);
  width: 44px; height: 44px;
  /* Above the player/frame and always reachable, even on mobile where the
     nav burger would otherwise sit in the same corner (the lightbox now
     covers the nav, so this is the only control in that corner). */
  z-index: 10;
  background: rgba(8, 7, 6, 0.55);
  border-radius: 999px;
  border: 0;
  cursor: pointer;
  padding: 0;
}
.lightbox-close-line {
  position: absolute;
  top: 50%; left: 6px; right: 6px;
  height: 1.5px;
  background: rgba(255,255,255,0.85);
  transform-origin: center;
}
.lightbox-close-line:nth-child(1) { transform: rotate(45deg); }
.lightbox-close-line:nth-child(2) { transform: rotate(-45deg); }
/* ===================================================================
   MOBILE WORK PAGE — single-column cinematic feed.
   On phones the masonry collapses to one column. Rather than every
   tile autoplaying at once (which buries the work), only the project
   nearest the vertical centre of the screen plays; the rest rest on
   their still frame. Focus passes from one piece to the next as you
   scroll — one subject at a time, the way a reel should read.
=================================================================== */
/* Inline section header is mobile-only; on desktop the floating
   blurred label does this job, so it stays hidden there. (Declared
   before the mobile block so the mobile override wins by source order.) */
.work-section-head { display: none; }

@media (hover: none), (pointer: coarse) {
  .work-grid { gap: 4px; }
  .work-section { margin-bottom: clamp(18px, 6vw, 36px); }

  /* Each tile's video is hidden until it becomes the active (centred)
     tile, then crossfades up from the poster beneath it. Paused tiles
     show their poster still, so the column reads as a set of stills
     with a single live frame moving through it. */
  .work-grid .tile-media video {
    opacity: 0;
    transition: opacity 500ms cubic-bezier(.22,.61,.36,1);
  }
  .work-grid .tile.is-playing .tile-media video { opacity: 1; }

  /* No tile titles on mobile — remove every project-name overlay. */
  .work-grid .tile .tile-overlay,
  .work-grid .tile.is-playing .tile-overlay { display: none !important; }

  /* Mobile titles ride natively via position: sticky inside each section,
     so motion is perfectly in sync with scroll (no swim, no jump). JS only
     fades them. The see-through blend is kept (no transform, which would
     have killed it). Hide the desktop floating title and the inline head. */
  .work-labels-layer { display: none !important; }
  .work-section-head { display: none !important; }
  .work-label-sticky {
    display: block;
    position: -webkit-sticky;
    position: sticky;
    top: 46vh;
    height: 0;                 /* takes no layout space; text overflows */
    z-index: 40;
    margin-left: clamp(22px, 5.6vw, 34px);
    font-family: 'Inter', sans-serif;
    font-size: clamp(22px, 5.8vw, 28px);
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    color: #fff;               /* same see-through treatment as the rest */
    mix-blend-mode: difference;
    opacity: 0;
    filter: blur(8px);
    pointer-events: none;
    will-change: opacity, filter;
  }
}

/* ===================================================================
   MOBILE HEADER — minimal bar + full-screen overlay menu.
   The full wordmark and horizontal menu are a desktop pattern that
   crowds a phone. On mobile the bar collapses to an "MB" monogram on
   the left and a small menu button on the right; tapping opens a
   full-screen overlay with large links. Reclaims the top so the work
   and reel breathe. Monogram + burger use the see-through treatment so
   they read over any background.
=================================================================== */
.brand-mono { display: none; }
.m-burger { display: none; }
.m-menu { display: none; }
.m-veil { display: none; }

@media (max-width: 720px) {
  .brand-name {
    display: inline-block;
    color: #fff;
    mix-blend-mode: difference !important;
  }
  .brand-sub { display: none; }
  .menu-flat { display: none; }

  /* ===============================================================
     WORK-FEED MOBILE FIXES (phones, <=720px only — desktop untouched)
     1. Header legibility: a short dark->transparent scrim behind the
        fixed header keeps the wordmark + burger readable over footage.
     2. Header collision: push the whole feed clear of the fixed header
        so nothing renders underneath it.
     3. Section labels: a static inline header above each group, in
        reading flow (not sticky), so the role title never overlaps a
        tile or the header.
     4. Tiles: ONE column, every tile a 4:5 portrait frame so the feed
        reads as an even immersive stack where the next tile peeks in
        below.
     =============================================================== */

  /* (2) See-through header to match the homepage: the wordmark and
     burger invert against whatever is behind them (white +
     mix-blend-mode: difference), identical to index. No dark scrim —
     the blend keeps them legible over any footage on its own. */

  /* First tile bleeds to the very top of the screen (full-bleed hero),
     so the feed starts at the viewport top and the header floats over it,
     exactly like the homepage hero. */
  .work-main {
    padding-top: 0;
  }

  /* (4) Single-column feed, every tile a 4:5 portrait. Thin divider. */
  .work-grid {
    grid-template-columns: 1fr;
    gap: 4px;
  }
  /* One consistent aspect for every tile — heroes, halves, smalls,
     promoted solos and all per-section variants collapse to the same
     4:5 portrait on mobile. */
  .work-grid .tile,
  .work-grid .tile.is-hero,
  .work-grid .tile.is-wide,
  .work-grid .tile.is-m-solo,
  .work-grid .tile.is-half,
  .work-grid .tile.is-half-narrow,
  .work-grid .tile.is-small,
  .work-grid .tile.is-small-wide,
  .work-grid .tile.is-major,
  .work-grid .tile.is-minor,
  .work-grid .tile.is-three-quarter,
  .work-grid .tile.is-quarter,
  .work-grid .tile.is-wide-mate,
  .work-grid .tile.is-square {
    grid-column: 1 / -1;
  }
  .work-grid .tile .tile-media,
  .work-grid .tile.is-hero .tile-media,
  .work-grid .tile.is-wide .tile-media,
  .work-grid .tile.is-m-solo .tile-media,
  .work-grid .tile.is-half .tile-media,
  .work-grid .tile.is-half-narrow .tile-media,
  .work-grid .tile.is-small .tile-media,
  .work-grid .tile.is-small-wide .tile-media,
  .work-grid .tile.is-major .tile-media,
  .work-grid .tile.is-minor .tile-media,
  .work-grid .tile.is-three-quarter .tile-media,
  .work-grid .tile.is-quarter .tile-media,
  .work-grid .tile.is-wide-mate .tile-media,
  .work-grid .tile.is-square .tile-media {
    aspect-ratio: 4 / 5;
  }

  /* The very first tile (first section's hero) is a full-bleed, full-screen
     opener: the full viewport height. It is already full width because the
     feed has no side padding, so NO 100vw/transform breakout is used — that
     overflows the viewport on iOS and lets the page slide left/right.
     Everything after it stays 4:5 and is revealed as you scroll. */
  .work-section:first-child .work-grid .tile:first-child .tile-media {
    aspect-ratio: auto;
    height: 100vh;
    height: 100svh;
    border-radius: 0;
  }

  /* (3) Inline section header (Director / Specialty / Camera).
     Sits ABOVE each section's grid in normal scroll flow — NOT sticky —
     so it can never overlap a tile or be hidden behind the fixed
     header. Solid white plus a soft shadow keeps it legible over the
     dark page background and any footage that scrolls behind it. */
  .work-section-head {
    display: block;
    position: static;
    margin: clamp(14px, 4vw, 22px) 0 var(--edge);
    padding: 2px var(--edge) 10px;
    font-family: 'Inter', sans-serif;
    font-size: clamp(20px, 6vw, 30px);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6), 0 2px 18px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  /* Sections after the first need extra room above their header so each
     group reads as a separate beat in the feed. */
  .work-section + .work-section .work-section-head {
    margin-top: clamp(28px, 9vw, 56px);
  }

  .brand-mono {
    display: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.04em;
    line-height: 1;
    color: #fff;
    /* Solid white over the scrim — no blend on mobile (see note above). */
    mix-blend-mode: normal;
  }

  .m-burger {
    display: inline-flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    width: 34px; height: 34px;
    padding: 0; margin: 0;
    background: none; border: 0; cursor: pointer;
    /* See-through blend to match the homepage burger. */
    mix-blend-mode: difference;
  }
  .m-burger span {
    display: block; height: 2px; width: 28px; margin-left: auto;
    background: #fff; border-radius: 2px;
    transform-origin: center;
    transition: transform 320ms cubic-bezier(.22,.61,.36,1),
                opacity 220ms ease;
  }
  /* The hamburger IS the close control: while the menu is open it morphs
     into an X in place (upper right) — matches the homepage menu. */
  .m-burger.is-open span:nth-child(1) {
    transform: translateY(4px) rotate(45deg);
  }
  .m-burger.is-open span:nth-child(2) {
    transform: translateY(-4px) rotate(-45deg);
  }

  /* Keep the nav ABOVE the overlay on mobile so the wordmark stays visible
     in the upper-left and the burger/X stays tappable in the upper-right
     while the menu is open. Desktop nav z-index (50) is unchanged. */
  .nav { z-index: 410; }

  /* ===============================================================
     MOBILE MENU — matches the homepage (index.html) exactly:
       z-390  .m-veil   frosts/blurs the page behind it with a light tint
       z-395  .m-menu   the links, over the blur
       z-410  .nav      wordmark + burger/X stay on top (above)
     The burger morphs into an X to close; the menu also closes on a link
     tap, an empty-space tap, or Escape.
     =============================================================== */
  .m-veil {
    display: block;
    position: fixed; inset: 0;
    z-index: 390;
    background: rgba(10, 9, 8, 0.42);
    -webkit-backdrop-filter: blur(22px) saturate(1.05);
    backdrop-filter: blur(22px) saturate(1.05);
    opacity: 0; pointer-events: none;
    transition: opacity 420ms cubic-bezier(.22,.61,.36,1);
  }
  .m-veil.open { opacity: 1; }

  .m-menu {
    display: block;
    position: fixed; inset: 0;
    z-index: 395;
    background: transparent;
    opacity: 0; pointer-events: none;
    transition: opacity 360ms cubic-bezier(.22,.61,.36,1);
  }
  .m-menu.open { opacity: 1; pointer-events: auto; }
  .m-menu-links {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(24px, 5.5vh, 44px);
  }
  .m-menu-links a {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: clamp(32px, 9vw, 48px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
    color: #EDE6D8;
    text-shadow: 0 1px 3px rgba(0,0,0,0.55), 0 2px 22px rgba(0,0,0,0.45);
    text-decoration: none;
    transition: color 200ms ease;
  }
  .m-menu-links a:active { color: #fff; }
}

/* ===================================================================
   GLOBAL SEE-THROUGH TEXT — every piece of text uses white +
   mix-blend-mode: difference so it reads over any background,
   identical to the homepage intro wordmark. Applied site-wide.
=================================================================== */
.brand, .brand-name,
.menu-flat, .menu-flat-link, .menu-flat-link:hover, .menu-flat-link.is-current,
.menu-flat-sep, .tile-overlay-title,
.lightbox-meta, .lightbox-title {
  color: #fff !important;
  mix-blend-mode: difference !important;
}
/* ===================================================================
   BLEND ARCHITECTURE FIX — where mix-blend-mode: difference must be
   applied to actually invert against the page.

   The see-through effect only works when the blended element is in
   (or composites against) the ROOT stacking context. Applying it to
   a child inside an isolated stacking context blends against that
   parent's background (transparent) instead of the page — so the text
   just stays white, with no inversion.

   .nav is position:fixed → root stacking context. Applying the blend
   to .nav itself makes its white content invert against the page.
   Children inside .nav must be reset to normal so they don't double-blend
   against the nav's transparent background before the nav composites.
=================================================================== */
.nav {
  mix-blend-mode: difference;
}
.nav .brand-name,
.nav .brand-mono,
.nav .brand-sub-dot,
.nav .menu-flat,
.nav .menu-flat-link,
.nav .menu-flat-link:hover,
.nav .menu-flat-link.is-current,
.nav .menu-flat-sep,
.nav .m-burger,
.nav .m-burger span {
  mix-blend-mode: normal !important;
}

/* Tile overlay: apply the blend to the overlay element (not just the
   title text inside it). The overlay (position:absolute, z-index:2 in
   the tile's stacking context) composites with difference blend against
   the tile's content — poster and video. The dark gradient inverts to
   near-transparent over the video, and the white title text inverts
   against the actual footage frame. */
.tile-overlay {
  mix-blend-mode: difference;
}
.tile-overlay-title {
  mix-blend-mode: normal !important;
}

</style>

</head>
<body class="wk-hold-nav wk-hold-label">

<div class="page-cover" id="pageCover" aria-hidden="true"></div>

<!-- ====== NAV ====== -->


<!-- ====== WORK MAIN ====== -->
<main class="work-main" id="workMain">
  <!-- Sections inserted by JS, one per role group with at least one project.
       Each section has a label band (alternating left/right alignment) and
       a grid of tiles below it. -->
</main>

<!-- ====== LIGHTBOX ====== -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <span class="lightbox-close-line"></span>
    <span class="lightbox-close-line"></span>
  </button>
  <div class="lightbox-frame">
    <div class="lightbox-meta">
      <h3 class="lightbox-title" id="lightboxTitle"></h3>
    </div>
    <div class="lightbox-player">
      <video id="lightboxVideo" controls playsinline preload="metadata"></video>
    </div>
    <div class="lightbox-foot">
      <span class="lightbox-role" id="lightboxRole"></span>
    </div>
  </div>
</div>

<script>
/* ============================================================
   WORK PAGE
   Loads content/site.txt, builds role-grouped sections of tiles,
   and wires up tile hover (preview) and click (lightbox) behavior.

   The order of sections is fixed: Director, Cinematographer,
   Specialty Camera. Sections only render when at least one
   project has the matching role; an empty section renders nothing.
   ============================================================ */
(function() {

  const ROLE_ORDER = ['Director', 'Specialty Camera', 'Operator'];

  // Display labels for each role. The role values stored in site.txt
  // and used as data keys throughout the code stay unchanged; only
  // the visible label printed on the page differs. This means you
  // can rename what shows up on screen without renaming every
  // WORK_N_ROLE = ... line in site.txt.
  const ROLE_LABEL = {
    'Director':         'Director',
    'Specialty Camera': 'Specialty',
    'Operator':         'Camera'
  };

  // Read site.txt and parse into a flat key/value map.
  async function loadConfig() {
    try {
      const res = await fetch('content/site.txt', { cache: 'no-cache' });
      if (!res.ok) return {};
      const text = await res.text();
      const cfg = {};
      text.split(/\r?\n/).forEach(line => {
        const trimmed = line.split('#')[0].trim();
        if (!trimmed) return;
        const idx = trimmed.indexOf('=');
        if (idx === -1) return;
        const key = trimmed.slice(0, idx).trim();
        const val = trimmed.slice(idx + 1).trim();
        cfg[key] = val;
      });
      return cfg;
    } catch (e) {
      console.warn('site.txt load failed', e);
      return {};
    }
  }

  // Resolve a file value into a usable src. If the value contains a
  // slash, treat it as a full path from root. Otherwise, look for it
  // inside media/work-N/.
  function resolveSrc(value, defaultFolder) {
    if (!value) return '';
    if (value.indexOf('/') !== -1) return value;
    return defaultFolder + '/' + value;
  }

  // Collect all configured WORK projects, in numeric order.
  function collectProjects(cfg) {
    const projects = [];
    let missCount = 0;
    for (let n = 1; n < 200 && missCount < 12; n++) {
      const file  = cfg['WORK_' + n + '_FILE'];
      const full  = cfg['WORK_' + n + '_FULL'];
      const title = cfg['WORK_' + n + '_TITLE'];
      const role  = cfg['WORK_' + n + '_ROLE'];
      const wide  = (cfg['WORK_' + n + '_WIDE'] || '').toLowerCase() === 'true';
      // Optional explicit order within the section. If unset, falls
      // back to the project's slot number N. Useful when projects
      // need to appear in a different order than their slot numbers
      // (e.g. you want a project with a higher slot number to
      // appear before one with a lower number in the same section).
      const orderRaw = cfg['WORK_' + n + '_ORDER'];
      const order = orderRaw ? parseInt(orderRaw, 10) : n;
      if (file && full && title && role) {
        projects.push({ n, file, full, title, role, wide, order });
        missCount = 0;
      } else {
        missCount++;
      }
    }
    return projects;
  }

  // Group projects by role, in the canonical order. Within each
  // group, projects are sorted by their ORDER value (which falls
  // back to N if no explicit order was set). Only roles that have
  // at least one project end up with a section.
  function groupByRole(projects) {
    const groups = [];
    ROLE_ORDER.forEach(role => {
      const matches = projects
        .filter(p => p.role === role)
        .sort((a, b) => a.order - b.order);
      if (matches.length > 0) groups.push({ role, projects: matches });
    });
    return groups;
  }

  // Build the DOM: a sequence of <section> elements, each with a
  // section-head label and a tile grid.
  // Specialty Camera and Operator share the cluster macro structure
  // — one hero opener, then a cluster row of one half + two smalls
  // at matched heights. The position of the half tile within the
  // cluster differs by section so each row 2 has a distinct
  // silhouette and the cluster anchor sweeps left → center →
  // right down the page.
  //
  // Director is the exception: all-large tiles, no smalls. Hero
  // opener, a paired row of two halves in the middle, and a second
  // hero at the bottom. The next section (Specialty Camera) also
  // opens on a hero, so the Director → SC transition has two large
  // tiles back-to-back. This is an intentional design choice for
  // Director only.
  //
  //   Director (all large, 3 rows)
  //     tile 1: hero (12 wide, 2.39:1 opener)
  //     tile 2: three-quarter (9 wide, 16:9 — left of middle row,
  //             takes 3/4 of the row length)
  //     tile 3: quarter (3 wide, 16:27 — right of middle row,
  //             portrait-ish frame, video crops to center ~33%
  //             horizontally)
  //     tile 4: hero (12 wide, 2.39:1 closer)
  //
  //   Specialty Camera (cluster anchor CENTER, 2 rows)
  //     tile 1: hero
  //     tile 2: small (left accent, ~8:9 cropped)
  //     tile 3: half (cluster anchor, full 16:9)
  //     tile 4: small (right accent, ~8:9 cropped)
  //
  //   Operator (cluster anchor RIGHT, 2 rows)
  //     tile 1: hero
  //     tile 2: small (left accent)
  //     tile 3: small (centered accent)
  //     tile 4: half (cluster anchor on the right, full 16:9)
  //
  // WORK_N_WIDE=true promotes a tile to the FIRST is-hero slot of
  // its section. For Director, that's slot 1 (the opener). Other
  // tiles fill the remaining slots in N-order, so the second hero
  // (Director slot 4) lands on whichever non-WIDE Director project
  // is fourth in site.txt order.
  const LAYOUT_BY_ROLE = {
    'Director':         ['is-hero', 'is-three-quarter', 'is-quarter', 'is-hero'],
    'Specialty Camera': ['is-hero', 'is-small', 'is-half', 'is-small'],
    'Operator':         ['is-hero', 'is-half', 'is-half', 'is-hero']
  };

  function buildPage(groups) {
    const main = document.getElementById('workMain');
    if (!main) return;
    main.innerHTML = '';

    groups.forEach((group) => {
      const section = document.createElement('section');
      section.className = 'work-section';
      section.setAttribute('data-role', group.role);

      // Mobile sticky title: lives inside the section so the browser moves
      // it with the content natively (position: sticky), perfectly in sync
      // with scroll and with no swim. JS only animates its opacity/blur.
      // First child + z-index so it paints on top of the tiles and the
      // see-through blend still inverts against them. Hidden on desktop,
      // where the floating fixed-layer title is used instead.
      const mLabel = document.createElement('span');
      mLabel.className = 'work-label-sticky';
      mLabel.setAttribute('data-role', group.role);
      mLabel.textContent = ROLE_LABEL[group.role] || group.role;
      section.appendChild(mLabel);

      // Inline section header — shown on mobile (the floating blurred
      // label is hidden there). Scrolls naturally above each group.
      const head = document.createElement('div');
      head.className = 'work-section-head';
      head.textContent = ROLE_LABEL[group.role] || group.role;
      section.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'work-grid';

      // Layout selection. Sections with fewer than 4 tiles use a
      // simpler shape (everything cinemascope or hero + pair) so a
      // curated section with just 2-3 strong pieces doesn't get
      // jammed into the 4-tile cluster layout where smaller tiles
      // would crop their videos. Sections with 4+ tiles use the
      // role-specific layout from LAYOUT_BY_ROLE above.
      const count = group.projects.length;
      let layout;
      if (count === 1) {
        layout = ['is-hero'];
      } else if (count === 2) {
        // Asymmetric pair in a single row. The WIDE project goes
        // to the major slot (8 cols, 16:9 landscape). The other
        // project goes to the minor slot (4 cols, 8:9 — 16:9
        // source crops to ~50% center horizontally). Picked over
        // two stacked heroes because two full-width tiles in a row
        // read as repetitive at the same scale.
        layout = ['is-major', 'is-minor'];
      } else if (count === 3) {
        // Hero opener, then a paired row of two halves below.
        layout = ['is-hero', 'is-half', 'is-half'];
      } else if (count === 4) {
        layout = LAYOUT_BY_ROLE[group.role] || [];
      } else if (count === 5 && group.role === 'Operator') {
        // Camera section with 5 projects: hero opener, then a row
        // of paired halves, then a wide-mate + square bottom row.
        //   row 1: hero
        //   row 2: half + half
        //   row 3: wide-mate (8 cols, 2:1) + square (4 cols, 1:1)
        layout = ['is-hero', 'is-half', 'is-half', 'is-wide-mate', 'is-square'];
      } else if (count === 6 && group.role === 'Specialty Camera') {
        // Specialty section with 6 projects: hero, then a cluster row,
        // then a bottom row of two halves.
        //   row 1: hero
        //   row 2: small-wide (CRACKED, span 4) + half-narrow (span 5)
        //          + small (span 3) — totals 12, equal heights
        //   row 3: half + half
        layout = ['is-hero', 'is-small-wide', 'is-half-narrow', 'is-small', 'is-half', 'is-half'];
      } else {
        // 5+ tiles: take the role's standard 4-tile layout and
        // extend it by appending hero slots for the remaining
        // projects. Adds one extra row per extra tile (each new
        // hero is a full-width cinematic closer). Used when a
        // section has more projects than the standard layout
        // accommodates.
        const base = LAYOUT_BY_ROLE[group.role] || [];
        const extras = new Array(Math.max(0, count - base.length)).fill('is-hero');
        layout = base.concat(extras);
      }
      // Find the slot that receives the WIDE-flagged project. Most
      // layouts use 'is-hero' for that slot, but the 2-tile asym
      // pair uses 'is-major'. Fall back to position 0 for any
      // layout that doesn't include 'is-hero'.
      let heroIdx = layout.indexOf('is-hero');
      if (heroIdx === -1 && layout.length > 0) heroIdx = 0;

      // A tile marked WIDE in site.txt becomes this section's hero.
      // Other tiles fill the remaining slots in numeric order.
      const heroProject = group.projects.find(p => p.wide);
      const others = heroProject
        ? group.projects.filter(p => p !== heroProject)
        : group.projects.slice();

      // Walk the layout slots and assign a project to each.
      const slotted = [];
      let othersIdx = 0;
      for (let i = 0; i < layout.length; i++) {
        if (i === heroIdx && heroProject) {
          slotted.push({ project: heroProject, cls: layout[i] });
        } else if (othersIdx < others.length) {
          slotted.push({ project: others[othersIdx], cls: layout[i] });
          othersIdx++;
        }
      }
      // Any additional projects beyond layout length fall through
      // with the default class (half-width pair tile).
      while (othersIdx < others.length) {
        slotted.push({ project: others[othersIdx], cls: '' });
        othersIdx++;
      }

      slotted.forEach((entry) => {
        const p = entry.project;
        const cls = entry.cls;
        // Folder name includes the section suffix so it's clear at
        // a glance which section each project belongs to. Director
        // → 'director', Specialty Camera → 'specialty', Operator → 'camera'.
        const sectionSlug = {
          'Director':         'director',
          'Specialty Camera': 'specialty',
          'Operator':         'camera'
        }[p.role] || 'unknown';
        const folder = 'media/work-' + p.n + '-' + sectionSlug;
        const fileSrc = resolveSrc(p.file, folder);
        const fullSrc = resolveSrc(p.full, folder);

        const tile = document.createElement('a');
        tile.className = 'tile' + (cls ? ' ' + cls : '');
        tile.href = '#';
        tile.setAttribute('data-slot', 'work-' + p.n);
        tile.setAttribute('data-full', fullSrc);
        tile.setAttribute('data-title', p.title);
        tile.setAttribute('data-role', p.role);

        // Poster = small still JPG in the same folder. Shows instantly so
        // the tile is never blank, even before the (large) video loads or
        // if it never loads on a slow connection.
        const posterSrc = folder + '/poster.jpg';

        tile.innerHTML =
          '<div class="tile-media">' +
            '<img class="tile-poster" src="' + posterSrc + '" alt="' + p.title + '" loading="lazy">' +
            '<video preload="metadata" muted loop playsinline webkit-playsinline disablepictureinpicture poster="' + posterSrc + '">' +
              '<source src="' + fileSrc + '" type="video/mp4">' +
            '</video>' +
          '</div>' +
          '<div class="tile-overlay">' +
            '<span class="tile-overlay-title">' + p.title + '</span>' +
          '</div>';

        grid.appendChild(tile);
      });

      section.appendChild(grid);
      main.appendChild(section);
    });

    // Labels layer. Appended AFTER all sections so that, in the
    // root stacking context's tree-order traversal, labels are
    // painted LAST, on top of every tile. The layer itself is a
    // non-positioned <div> with no isolation, so it does NOT
    // create a stacking context. Each label inside is position:
    // fixed (positioned against the viewport, controlled by JS)
    // and uses mix-blend-mode: difference. Because the layer
    // doesn't create a stacking context, the labels share the
    // root stacking context with the section tiles, which is
    // exactly what mix-blend-mode needs in order to blend against
    // the tile pixels behind it.
    const labelsLayer = document.createElement('div');
    labelsLayer.className = 'work-labels-layer';
    groups.forEach((group) => {
      const label = document.createElement('span');
      label.className = 'work-section-label';
      label.setAttribute('data-role', group.role);
      label.textContent = ROLE_LABEL[group.role] || group.role;
      labelsLayer.appendChild(label);
    });
    main.appendChild(labelsLayer);
  }

  // Mobile-only layout aid: in the 2-up mobile grid (see the
  // max-width:720px CSS), section heroes span the full width and the
  // remaining tiles pair two-up in reading order. Within each section we
  // walk the tiles in order, treating the full-width tiles (is-hero /
  // is-wide) as run-breakers; any run of half-width companions with an odd
  // count gets its LAST tile promoted to full width (.is-m-solo) so a row
  // never renders a half-width tile beside an empty gap. Desktop ignores
  // .is-m-solo entirely (the class is only consumed inside the mobile
  // media query), so this is safe to set on every build.
  function promoteMobileSolos() {
    const FULL = ['is-hero', 'is-wide'];
    document.querySelectorAll('.work-section .work-grid').forEach((grid) => {
      const tiles = Array.from(grid.children).filter((el) =>
        el.classList && el.classList.contains('tile'));
      let run = [];
      const flush = () => {
        if (run.length % 2 === 1) {
          run[run.length - 1].classList.add('is-m-solo');
        }
        run = [];
      };
      tiles.forEach((tile) => {
        tile.classList.remove('is-m-solo');
        const isFull = FULL.some((c) => tile.classList.contains(c));
        if (isFull) { flush(); } else { run.push(tile); }
      });
      flush();
    });
  }

  // Hover play/pause for tile videos. On mouseenter, play. On
  // mouseleave, pause and reset to first frame for a clean idle state.
  //
  // On touch devices there is no hover, so instead we autoplay each
  // tile's video when it scrolls into view (muted + loop + playsinline,
  // which iOS permits for autoplay) and pause it when it leaves the
  // viewport to save battery and data. Tapping a tile still opens the
  // full video in the lightbox (wired separately).
  function wireTileHover() {
    const isTouch = window.matchMedia &&
      window.matchMedia('(hover: none), (pointer: coarse)').matches;

    if (isTouch) {
      // Mobile / touch: thumbnails play ONE AT A TIME, advancing in reading
      // order as you scroll — the section hero first, then the LEFT tile of
      // the next paired row, then (a little further down) the RIGHT tile,
      // then the next row, and so on. This mirrors how a cursor would sweep
      // the desktop grid, and keeps only one video decoding at a time so the
      // feed stays smooth on cellular. Tapping a tile still opens the full
      // video in the lightbox (wired separately).
      const tiles = Array.from(document.querySelectorAll('.work-grid .tile'));
      if (!tiles.length) return;

      // Fraction of viewport height that acts as the "playhead" line: a tile
      // goes live once its centre scrolls up past this line.
      const PLAYHEAD = 0.42;

      let active = null;

      function setActive(tile) {
        if (tile === active) return;
        // Stand down the previous one.
        if (active) {
          active.classList.remove('is-playing');
          const pv = active.querySelector('video');
          if (pv) { try { pv.pause(); pv.currentTime = 0; } catch (e) {} }
        }
        active = tile;
        if (active) {
          const v = active.querySelector('video');
          if (v) {
            // Explicit iOS-safe defaults: muted + playsinline as JS
            // properties AND attributes (some Safari builds only honor the
            // attribute form), then load() if the source hasn't started.
            v.muted = true;
            v.playsInline = true;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            if (v.preload !== 'auto') v.preload = 'auto';
            if (v.readyState === 0) { try { v.load(); } catch (e) {} }
            active.classList.add('is-playing');
            const p = v.play();
            if (p && p.catch) p.catch(() => {});
          }
        }
      }

      // The active tile is the one whose centre is nearest the vertical
      // centre of the screen. As a tile scrolls up and off, the next tile's
      // centre becomes closer and takes over while the leaving tile is still
      // mostly in view, so the leaving tile's title never rides up to the top
      // of the screen detached from its footage. This mirrors desktop hover:
      // the one prominent tile in frame names itself, the rest stay silent.
      function pickCentre() {
        // At the very top, the first tile's centre sits above mid-screen, so
        // nearest-centre would skip to the second tile. Force the first tile
        // active while resting at the top so it plays and titles like the rest.
        if ((window.pageYOffset || document.documentElement.scrollTop || 0) < 4) {
          setActive(tiles[0]); return;
        }
        const mid = (window.innerHeight || document.documentElement.clientHeight) / 2;
        let best = null, bestDist = Infinity;
        for (let i = 0; i < tiles.length; i++) {
          const r = tiles[i].getBoundingClientRect();
          const dist = Math.abs(r.top + r.height / 2 - mid);
          if (dist < bestDist) { bestDist = dist; best = tiles[i]; }
        }
        if (best) setActive(best);
      }

      // Re-evaluate on scroll, throttled to one check per frame.
      let ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () { pickCentre(); ticking = false; });
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', pickCentre);
      pickCentre();
      requestAnimationFrame(pickCentre);
      window.addEventListener('load', pickCentre);
      return;
    }

    // Desktop / pointer: play on hover, pause + reset on leave. The only
    // addition to the original behavior is the first tile (the Director
    // hero at the top), which autoplays a single pass on load — see below.
    document.querySelectorAll('.work-grid .tile').forEach(tile => {
      const video = tile.querySelector('video');
      if (!video) return;
      tile.addEventListener('mouseenter', () => {
        video.play().catch(() => {});
      });
      tile.addEventListener('mouseleave', () => {
        video.pause();
        try { video.currentTime = 0; } catch (e) {}
      });
    });

    // First thumbnail (Director hero) autoplays once when the page opens, so
    // the top of the page isn't a static frame while the cursor is still up
    // by the nav after clicking "Work". It plays a single pass (loop turned
    // off just for this), then pauses back on its first frame and hands off
    // to the normal hover behavior. If the visitor hovers it before the pass
    // ends, looping is restored so it behaves exactly like every other tile.
    const firstTile = document.querySelector('.work-grid .tile');
    if (firstTile) {
      const fv = firstTile.querySelector('video');
      if (fv) {
        fv.muted = true;
        fv.loop = false;
        if (fv.preload !== 'auto') fv.preload = 'auto';
        fv.addEventListener('ended', function () {
          fv.pause();
          try { fv.currentTime = 0; } catch (e) {}
          fv.loop = true;
        }, { once: true });
        firstTile.addEventListener('mouseenter', function () { fv.loop = true; }, { once: true });
        const p0 = fv.play();
        if (p0 && p0.catch) p0.catch(function () {});
      }
    }
  }

  // Wire the labels.
  //
  // Labels are NOT inside their sections any more. They live in a
  // sibling .work-labels-layer container appended after every
  // section, with position: fixed. This guarantees they paint
  // after every tile in the root stacking context and can never
  // be hidden behind a thumbnail.
  //
  // For each frame this function:
  //   1. Finds the section's current bounding rect in viewport.
  //   2. Decides where the corresponding label should sit:
  //      - Section fully out of viewport: hidden.
  //      - Section's top is below viewport center: label tracks
  //        the section's top edge plus an inset (so the label
  //        sits a little below the top, breathing room from the
  //        gap line above).
  //      - Section's bottom is above viewport center: label
  //        tracks the section's bottom edge minus an inset (so
  //        the label sits a little above the bottom, equal
  //        breathing room to the gap line below).
  //      - Section straddles viewport center with enough room:
  //        label is centered on 50vh.
  //   3. Decides the label's blur state:
  //      - Section contains viewport center: filter: none (sharp).
  //      - In viewport but does NOT contain center: filter: blur(8px).
  //      - Out of viewport: hidden (opacity 0).
  //
  // The thresholds that switch the label between "tracking an
  // edge" and "centered on 50vh" are shifted by the same inset
  // value, so the label's position is continuous (no jump) at
  // those transitions.
  //
  // Two adjacent labels are visible at the same time during a
  // boundary crossing — one sharp, one blurred — and the cross-fade
  // happens via the CSS transition on filter. They are never both
  // sharp simultaneously.
  function wireStickyLabels() {
    const sections = document.querySelectorAll('.work-section');
    if (!sections.length) return;

    // Pair each section with its corresponding label, matched by
    // the data-role attribute.
    const pairs = [];
    sections.forEach(section => {
      const role = section.getAttribute('data-role');
      if (!role) return;
      const label = document.querySelector(
        '.work-section-label[data-role="' + role + '"]'
      );
      if (label) pairs.push({ section: section, label: label });
    });
    if (!pairs.length) return;

    // Mobile only: clamp the floating label so it can never slide up
    // under the fixed header bar. Returns 0 on desktop, so desktop label
    // positioning is left exactly as-is.
    const mqMobile = window.matchMedia('(max-width: 720px)');
    function navClearance() {
      if (!mqMobile.matches) return 0;
      const navH = parseInt(
        getComputedStyle(document.documentElement)
          .getPropertyValue('--nav-h')
      ) || 64;
      return navH + 34;
    }

    // labelH: the label's rendered height. Needed to clamp its
    // position to the section's bounds.
    // labelPad: breathing room between the label and the section's
    // top or bottom edge, kept equal at both ends so the label
    // reads as having the same gap above the next-section line
    // as the next section's label has below it.
    let labelH = 24;
    let labelPad = 16;
    function measureLayout() {
      labelH = pairs[0].label.offsetHeight || 24;
      labelPad = Math.max(14, Math.min(22, Math.round(window.innerWidth * 0.013)));
    }

    function update() {
      if (mqMobile.matches) return;   // mobile uses sticky titles (wireMobileLabels)
      const vh = window.innerHeight;
      const vc = vh / 2;
      const halfLabel = labelH / 2;
      const PAD = labelPad;

      // Scroll-driven cross-fade.
      //
      // The blur on each label is computed continuously from the
      // current scroll position. As the user scrolls a section
      // toward the viewport center, that section's label gains
      // focus weight (blur decreases toward 0); the section being
      // left behind loses weight (blur increases toward 8). The
      // cross-fade is therefore tied to scroll, not to a timer.
      //
      // For each pair of adjacent sections (i, i+1), define a
      // handoff parameter t in [0, 1]:
      //   t = 0 when the next section's top is far below center
      //         (specifically at vc + Z, where Z is the transition
      //         zone size).
      //   t = 1 when the next section's top has reached the
      //         position where its label settles at viewport center
      //         (vc - halfLabel - PAD). Aligning t=1 with the
      //         position-clamp threshold means the blur transition
      //         and the position transition complete on the same
      //         scroll frame.
      // Linear interpolation in between.
      //
      // Each section's focal weight is then:
      //   w_0       = 1 - t_{0,1}
      //   w_k (mid) = t_{k-1,k} - t_{k,k+1}
      //   w_N       = t_{N-1,N}
      // These sum to 1 at all times, so as one label gains weight
      // an adjacent label loses an equal amount.
      //
      // The label's blur in pixels is 8 * (1 - w).
      const Z = vh * 0.15;
      const START_TOP = vc + Z;
      const END_TOP = vc - halfLabel - PAD;
      const DENOM = Math.max(1, START_TOP - END_TOP);

      const ts = [];
      for (let i = 0; i < pairs.length - 1; i++) {
        const nextRect = pairs[i + 1].section.getBoundingClientRect();
        const raw = (START_TOP - nextRect.top) / DENOM;
        ts.push(Math.max(0, Math.min(1, raw)));
      }

      const weights = [];
      for (let i = 0; i < pairs.length; i++) {
        let w;
        if (pairs.length === 1) {
          w = 1;
        } else if (i === 0) {
          w = 1 - ts[0];
        } else if (i === pairs.length - 1) {
          w = ts[i - 1];
        } else {
          w = ts[i - 1] - ts[i];
        }
        weights.push(Math.max(0, Math.min(1, w)));
      }

      pairs.forEach(function (pair, i) {
        const section = pair.section;
        const label = pair.label;
        const rect = section.getBoundingClientRect();

        const inViewport = rect.top < vh && rect.bottom > 0;

        if (!inViewport) {
          if (label.style.opacity !== '0') label.style.opacity = '0';
          if (label.style.filter !== 'blur(8px)') label.style.filter = 'blur(8px)';
          return;
        }

        // Position. The label rides its section bounds and settles at
        // centre, travelling as you scroll, the SAME on desktop and mobile:
        // it tracks the section's top as the section enters from below, sits
        // centred while the section owns the viewport, then tracks the
        // section's bottom as it leaves — so it stays inside its own section
        // and never crosses the divider into the next one. On DESKTOP the
        // travel is applied via `top`; on MOBILE via a GPU transform
        // (translateY), which the phone composites smoothly instead of
        // swimming the way per-frame `top` writes do.
        let labelTop;
        if (rect.top > vc - halfLabel - PAD) {
          labelTop = rect.top + PAD;
        } else if (rect.bottom < vc + halfLabel + PAD) {
          labelTop = rect.bottom - labelH - PAD;
        } else {
          labelTop = vc - halfLabel;
        }
        const nc = navClearance();
        if (nc) labelTop = Math.max(labelTop, nc);
        const yPx = Math.round(labelTop);
        if (mqMobile.matches) {
          const tf = 'translateY(' + yPx + 'px)';
          if (label.style.transform !== tf) label.style.transform = tf;
        } else {
          const desiredTop = yPx + 'px';
          if (label.style.top !== desiredTop) label.style.top = desiredTop;
          if (label.style.transform && label.style.transform !== 'none') label.style.transform = 'none';
        }

        // Cross-fade tied to the focal weight. The label that owns the
        // viewport centre is sharp and fully opaque; the one being left
        // behind fades AND blurs out at the same time, so two adjacent
        // titles dissolve smoothly into each other during the handoff
        // instead of both sitting fully opaque with only a blur difference
        // between them (which read as cluttered/clunky). Both values track
        // the scroll position exactly.
        const w = weights[i];
        const op = w.toFixed(3);
        if (label.style.opacity !== op) label.style.opacity = op;
        const blurPx = 8 * (1 - w);
        const fil = blurPx < 0.15
          ? 'none'
          : 'blur(' + blurPx.toFixed(2) + 'px)';
        if (label.style.filter !== fil) label.style.filter = fil;
      });
    }

    let ticking = false;
    function schedule() {
      if (!ticking) {
        requestAnimationFrame(function () { update(); ticking = false; });
        ticking = true;
      }
    }

    measureLayout();
    update();
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', function () {
      measureLayout();
      schedule();
    });

    // The first measure/update runs right after the tiles are built, before
    // fonts and tile media have finalised their sizes — which left the first
    // label mis-measured and made it jump on the first scroll ("clunky on
    // start"). Re-measure once the page has fully loaded and once the web
    // font is ready, so the labels are positioned correctly from frame one.
    window.addEventListener('load', function () { measureLayout(); update(); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { measureLayout(); update(); });
    }
  }

  // Mobile section titles. They are position:sticky inside each section, so
  // the BROWSER moves them with the content natively — perfectly in sync
  // with the finger, no swim, no jump, and the see-through blend survives
  // (no transform). This routine ONLY sets opacity + blur, never position.
  //
  // The cross-fade is centred on the black divider between two sections
  // passing the middle of the screen, with a generous lead-up zone, so the
  // outgoing title fades out as its tile nears the divider while the next
  // fades in low in the next tile. Sticky keeps each title inside its own
  // tile (the outgoing one can't pass its section's bottom, the incoming one
  // can't rise above its section's top), so neither ever sits on the divider.
  // Reverses naturally on scroll up because it's purely scroll-position based.
  function wireMobileLabels() {
    const mq = window.matchMedia('(max-width: 720px)');
    const sections = Array.prototype.slice.call(
      document.querySelectorAll('.work-section')
    );
    if (!sections.length) return;
    const labels = sections.map(function (s) {
      return s.querySelector('.work-label-sticky');
    });
    if (!labels.some(Boolean)) return;

    function update() {
      if (!mq.matches) return;
      const vh = window.innerHeight;
      const vc = vh / 2;
      const Z = vh * 0.30;          // lead-up zone: cross-fade spans ~0.6vh of scroll
      const DENOM = 2 * Z;

      // Handoff parameter per boundary: 0 when the next section's top edge
      // (the divider) is Z below centre, 0.5 at centre, 1 when it is Z above.
      const ts = [];
      for (let i = 0; i < sections.length - 1; i++) {
        const bTop = sections[i + 1].getBoundingClientRect().top;
        ts.push(Math.max(0, Math.min(1, (vc + Z - bTop) / DENOM)));
      }

      for (let i = 0; i < labels.length; i++) {
        const lab = labels[i];
        if (!lab) continue;
        let w;
        if (labels.length === 1) w = 1;
        else if (i === 0) w = 1 - ts[0];
        else if (i === labels.length - 1) w = ts[i - 1];
        else w = ts[i - 1] - ts[i];
        w = Math.max(0, Math.min(1, w));

        const op = w.toFixed(3);
        if (lab.style.opacity !== op) lab.style.opacity = op;
        const blurPx = 8 * (1 - w);
        const fil = blurPx < 0.15 ? 'none' : 'blur(' + blurPx.toFixed(2) + 'px)';
        if (lab.style.filter !== fil) lab.style.filter = fil;
      }
    }

    let ticking = false;
    function schedule() {
      if (!ticking) {
        requestAnimationFrame(function () { update(); ticking = false; });
        ticking = true;
      }
    }
    update();
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', schedule);
    window.addEventListener('load', update);
  }

  // Lightbox open/close and content swap.
  function wireLightbox() {
    const lightbox      = document.getElementById('lightbox');
    const lightboxVideo = document.getElementById('lightboxVideo');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxRole  = document.getElementById('lightboxRole');
    const closeBtn      = document.getElementById('lightboxClose');

    function openLightbox(src, title, role, poster) {
      // Show the tile's poster still while the full video buffers, so the
      // player is never a blank black box on open (especially on mobile).
      if (poster) lightboxVideo.setAttribute('poster', poster);
      else lightboxVideo.removeAttribute('poster');
      lightboxVideo.src = src;
      lightboxTitle.textContent = title || '';
      // Map the raw role ("Operator", "Specialty Camera") to the SAME
      // display label shown on the work-page section titles, so the credit
      // under the player always matches ("Camera", "Specialty", "Director").
      lightboxRole.textContent = role ? (ROLE_LABEL[role] || role) : '';
      lightbox.setAttribute('aria-hidden', 'false');
      // Hide the fixed nav (the close X is the only top-right control while
      // a project is playing). The CSS rule on body.lightbox-open does the
      // hiding; we just toggle the class here.
      document.body.classList.add('lightbox-open');
      lightboxVideo.play().catch(() => {});
    }
    function closeLightbox() {
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lightbox-open');
      lightboxVideo.pause();
      lightboxVideo.src = '';
    }

    document.querySelectorAll('.work-grid .tile').forEach(tile => {
      tile.addEventListener('click', (e) => {
        e.preventDefault();
        const posterEl = tile.querySelector('.tile-poster');
        openLightbox(
          tile.getAttribute('data-full'),
          tile.getAttribute('data-title'),
          tile.getAttribute('data-role'),
          posterEl ? posterEl.getAttribute('src') : null
        );
      });
    });
    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  }

  // Wire the contact link from site.txt EMAIL (with fallback).
  function wireContact(cfg) {
    const email = cfg.EMAIL;
    if (!email) return;
    const link = document.getElementById('contactLink');
    if (link) link.href = 'mailto:' + email;
  }

  // Fade out the page cover after content is built.
  function startWorkIntro() {
    const b = document.body;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      b.classList.remove('wk-hold-nav');
      b.classList.remove('wk-hold-label');
      return;
    }
    // 1) wordmark descends from the top, then 2) the active title fades in.
    setTimeout(function () { b.classList.remove('wk-hold-nav'); }, 360);
    setTimeout(function () {
      // enable a one-time fade, reveal the title, then remove the
      // transition so the scroll-linked cross-fade stays instant.
      b.classList.add('wk-intro-fade');
      requestAnimationFrame(function () { b.classList.remove('wk-hold-label'); });
      setTimeout(function () { b.classList.remove('wk-intro-fade'); }, 760);
    }, 1240);
  }

  function revealPage() {
    requestAnimationFrame(() => {
      const cover = document.getElementById('pageCover');
      if (cover) cover.classList.add('gone');
      startWorkIntro();
    });
  }

  async function init() {
    // Each step is isolated so that a failure in one (especially the
    // mobile video wiring on Safari) can never prevent the tiles from
    // rendering or leave the page stuck behind the cover. revealPage
    // runs in a finally block so the page ALWAYS becomes visible.
    function safe(label, fn) {
      try { fn(); } catch (e) { console.warn(label + ' failed', e); }
    }
    try {
      const cfg = await loadConfig();
      const projects = collectProjects(cfg);
      const groups = groupByRole(projects);
      safe('buildPage', function () { buildPage(groups); });
      safe('promoteMobileSolos', function () { promoteMobileSolos(); });
      safe('wireTileHover', function () { wireTileHover(); });
      safe('wireStickyLabels', function () { wireStickyLabels(); });
      safe('wireMobileLabels', function () { wireMobileLabels(); });
      safe('wireLightbox', function () { wireLightbox(); });
      safe('wireContact', function () { wireContact(cfg); });
    } catch (e) {
      console.warn('init failed', e);
    } finally {
      revealPage();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script>
/* Mobile overlay menu — matches the homepage (index.html): the burger
   opens a full-screen overlay over a frosted veil and morphs into an X to
   close. Closes on a link tap, an empty-space tap, or Escape. */
(function () {
  function initMenu() {
    var burger = document.querySelector('.m-burger');
    var menu = document.getElementById('mMenu');
    if (!burger || !menu) return;
    var veil = document.getElementById('mVeil');
    var links = menu.querySelectorAll('.m-menu-links a');

    function openMenu() {
      menu.classList.add('open');
      if (veil) veil.classList.add('open');
      burger.classList.add('is-open');
      burger.setAttribute('aria-expanded', 'true');
      burger.setAttribute('aria-label', 'Close menu');
      menu.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      menu.classList.remove('open');
      if (veil) veil.classList.remove('open');
      burger.classList.remove('is-open');
      burger.setAttribute('aria-expanded', 'false');
      burger.setAttribute('aria-label', 'Open menu');
      menu.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    function toggleMenu() {
      if (menu.classList.contains('open')) closeMenu();
      else openMenu();
    }
    burger.addEventListener('click', toggleMenu);
    // Tap on empty overlay space (not a link) closes the menu.
    menu.addEventListener('click', function (e) {
      if (e.target === menu || e.target.classList.contains('m-menu-links')) closeMenu();
    });
    for (var i = 0; i < links.length; i++) links[i].addEventListener('click', closeMenu);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && menu.classList.contains('open')) closeMenu();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMenu);
  } else {
    initMenu();
  }
})();
</script>
