<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0B09">
<title>Work — Mike Becker</title>
<meta name="description" content="Selected work. Mike Becker. Director and Specialty Camera based in Los Angeles." />
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

<style>
/* ======================================================
   ROOT TOKENS
   Inherits the same visual language as index.html so the
   site reads as one coherent piece. Edit values here only
   if the homepage tokens change.
====================================================== */
:root {
  --bg:           #0C0B09;
  --bg-2:         #161513;
  --fg:           #F4F1EB;
  --fg-dim:       #D9D5CC;
  --muted:        #8A867D;
  --accent-warm:  #C8B69A;

  /* Horizontal gutter for tile gaps and section padding. Matches
     the homepage exactly so the work page feels continuous with the
     rest of the site. */
  --edge:        clamp(8px, 1vw, 14px);

  /* Nav gutter — wider than --edge so the nav contents sit comfortably
     in from the page edges. */
  --nav-edge:    clamp(16px, 1.8vw, 28px);

  --radius:      clamp(8px, 0.9vw, 14px);
  --nav-h:       64px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-feature-settings: "ss01", "cv11";
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  /* The page cover fades on load to mask reflow. Mirrors the
     homepage handoff so navigation between pages feels continuous. */
}

a { color: inherit; text-decoration: none; }

/* ======================================================
   NAV — flat horizontal menu
   Brand on the left (name + role tagline that appears on hover).
   Flat horizontal nav on the right: Home / Work / About / Contact.
   No collapsible menu, no burger. The functional elements are
   visible at all times because top-tier director sites do not
   hide their navigation on desktop.
====================================================== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--nav-edge);
  pointer-events: none;
}
.nav > * { pointer-events: auto; }

/* Brand — same DOM and styles as the homepage so the upper-left
   identity is identical between pages. */
.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
}
.brand-name {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 28;
  font-weight: 500;
  font-size: 16px;
  letter-spacing: -0.005em;
  line-height: 1;
  text-transform: uppercase;
}
.brand-sub {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1),
              transform 320ms cubic-bezier(.22,.61,.36,1);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.72);
  line-height: 1;
  white-space: nowrap;
}
.brand:hover .brand-sub {
  opacity: 1;
  transform: translateX(0);
}
.brand-sub-bracket,
.brand-sub-dot {
  opacity: 0.55;
}

/* Flat nav — premium typographic menu, no toggle. Each item is
   small caps, wide tracking, with slashes between to echo the
   bracketed brand-sub typography. The current-page item gets
   full white; others sit at a slightly muted opacity. */
.menu-flat {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
}
.menu-flat-link {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  line-height: 1;
  color: rgba(255,255,255,0.72);
  transition: color 240ms cubic-bezier(.22,.61,.36,1);
  padding: 4px 2px;
}
.menu-flat-link:hover { color: #fff; }
.menu-flat-link.is-current { color: #fff; }
.menu-flat-sep {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: rgba(255,255,255,0.4);
  line-height: 1;
}

/* ======================================================
   PAGE COVER — fades out on load to mask any reflow during
   font loading and content injection.
====================================================== */
.page-cover {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 400;
  pointer-events: none;
  opacity: 1;
  transition: opacity 520ms cubic-bezier(.22,.61,.36,1);
}
.page-cover.gone { opacity: 0; }

/* ======================================================
   WORK PAGE
   Grid of project thumbnails, grouped into sections by role.

   Each section has a sticky role label (Director, Cinematographer,
   Specialty Camera) that sits in the upper-right of the viewport,
   below the nav. The label appears as you scroll into a section,
   stays sticky over that section's tiles, then fades out and
   travels up with the section as it leaves the viewport. The next
   section's label fades in as that section enters. Pattern adapted
   from director / commercial roster sites (Park Pictures and
   similar) where the persistent label tells the viewer what role
   was played across everything currently in view.

   Within each section, tiles default to 16:9 standard tiles that
   pair 2-up. Tiles marked WIDE=true in site.txt span the full
   width of the section as a 2.39:1 cinemascope frame. The user
   curates the rhythm by deciding which tiles are wide.
====================================================== */
.work-main {
  padding-top: var(--nav-h);
  padding-bottom: clamp(60px, 8vw, 120px);
}

.work-section {
  position: relative;
  margin-top: clamp(28px, 4vw, 56px);
}
.work-section:first-child {
  margin-top: clamp(8px, 1vw, 14px);
}

/* The sticky label, vertically centered on the viewport.

   How it works:
   - position:sticky with top:50vh sticks the label's top edge at
     the vertical center of the viewport
   - transform:translateY(-50%) shifts the label up by half its
     own height so its CENTER aligns with viewport center
   - As you scroll into a section, the label appears at viewport
     center and stays there (sticky)
   - As the section ends, sticky releases and the label is pushed
     up with the section's bottom edge, scrolling up out of view
   - Meanwhile the next section's label is approaching from below
     toward viewport center
   - JS applies blur and opacity to each label based on its
     distance from viewport center: sharp and opaque at center,
     blurred and transparent at the edges. This produces the
     crossfade-in-place feel where one label dissolves up as the
     next un-blurs into focus.
   - Pointer-events:none so the label is visual only and never
     blocks tile interactions. */
.work-section-sticky {
  position: sticky;
  top: 50vh;
  transform: translateY(-50%);
  z-index: 5;
  padding: 0 var(--edge);
  pointer-events: none;
  margin-bottom: clamp(14px, 1.8vw, 22px);
}

.work-section-label {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-size: clamp(14px, 1.4vw, 20px);
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 2px 18px rgba(0,0,0,0.75), 0 1px 4px rgba(0,0,0,0.5);
  line-height: 1;
  /* opacity and filter are set by JS based on distance from
     viewport center. will-change hints the compositor for smooth
     scroll-driven updates. */
  will-change: opacity, filter;
}

/* The grid within a section. Two columns on desktop; tiles
   marked .is-wide span both columns and use a cinemascope
   aspect ratio instead. The first tile in a section with
   only one tile also auto-spans (no orphan single column). */
.work-grid {
  display: grid;
  gap: var(--edge);
  padding: 0 var(--edge);
  grid-template-columns: 1fr;
}
@media (min-width: 760px) {
  .work-grid { grid-template-columns: 1fr 1fr; }
}

.work-grid .tile {
  position: relative;
  display: block;
  overflow: hidden;
  background: var(--bg-2);
  border-radius: var(--radius);
  cursor: pointer;
}
.work-grid .tile-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

/* Wide tiles: full row, cinemascope aspect ratio. Used for
   hero and closer positions within a section. */
.work-grid .tile.is-wide { grid-column: 1 / -1; }
@media (min-width: 760px) {
  .work-grid .tile.is-wide .tile-media { aspect-ratio: 2.39 / 1; }
}

/* A section with only one tile auto-promotes that tile to wide
   so it doesn't sit alone in column 1 with empty column 2. */
@media (min-width: 760px) {
  .work-grid:has(.tile:only-child) .tile {
    grid-column: 1 / -1;
  }
  .work-grid:has(.tile:only-child) .tile .tile-media {
    aspect-ratio: 2.39 / 1;
  }
}

/* Tile video / placeholder behavior — same as homepage. The
   video starts paused, autoplays muted on hover. Slight scale
   transform on the placeholder for a gentle hover-bloom. */
.tile-media video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transform: scale(1.02);
  transition: transform 700ms cubic-bezier(.22,.61,.36,1);
}
.tile:hover .tile-media video {
  transform: scale(1.0);
}

/* Tile overlay - title text floating over the lower-right of the
   tile, hidden by default and revealed on hover. The whole overlay
   (gradient scrim + title text) cross-fades together so when no
   tile is hovered the page is pure imagery; hovering any tile
   reveals that one project's title with its scrim. Position is
   lower-right per your direction, so it doesn't compete with the
   sticky section label in the upper-right corner. */
.tile-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: clamp(14px, 1.8vw, 24px) clamp(16px, 2vw, 28px);
  background: linear-gradient(to top, rgba(12,11,9,0.55) 0%, rgba(12,11,9,0) 100%);
  pointer-events: none;
  text-align: right;
  opacity: 0;
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1);
}
.tile:hover .tile-overlay {
  opacity: 1;
}
.tile-overlay-title {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 28;
  font-weight: 500;
  font-size: clamp(16px, 1.6vw, 24px);
  letter-spacing: -0.005em;
  line-height: 1;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4);
}

/* ======================================================
   LIGHTBOX — full-screen project player. Same DOM and
   behavior as the homepage so the click-into-project
   experience is identical across the site.
====================================================== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(8, 7, 6, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1);
}
.lightbox[aria-hidden="false"] {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-frame {
  width: min(94vw, 1400px);
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 1.6vw, 24px);
}
.lightbox-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  color: #fff;
  font-family: 'Inter', sans-serif;
}
.lightbox-title {
  margin: 0;
  font-variation-settings: "opsz" 32;
  font-weight: 500;
  font-size: clamp(18px, 1.8vw, 26px);
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.lightbox-player {
  position: relative;
  width: 100%;
  background: #000;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius);
  overflow: hidden;
}
.lightbox-player video {
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}
.lightbox-role {
  position: absolute;
  right: clamp(12px, 1.4vw, 22px);
  bottom: clamp(12px, 1.4vw, 22px);
  font-family: 'Inter', sans-serif;
  font-size: clamp(10px, 0.8vw, 12px);
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.78);
  padding: 6px 10px;
  background: rgba(0,0,0,0.4);
  border-radius: 999px;
  pointer-events: none;
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
}

.lightbox-close {
  position: absolute;
  top: clamp(14px, 1.6vw, 22px);
  right: clamp(14px, 1.6vw, 22px);
  width: 36px; height: 36px;
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 0;
}
.lightbox-close-line {
  position: absolute;
  top: 50%; left: 6px; right: 6px;
  height: 1.5px;
  background: rgba(255,255,255,0.85);
  transform-origin: center;
}
.lightbox-close-line:nth-child(1) { transform: rotate(45deg); }
.lightbox-close-line:nth-child(2) { transform: rotate(-45deg); }
</style>

</head>
<body>

<div class="page-cover" id="pageCover" aria-hidden="true"></div>

<!-- ====== NAV ====== -->
<nav class="nav" aria-label="Primary">
  <a href="index.html" class="brand" aria-label="Home">
    <span class="brand-name">Mike Becker</span>
    <span class="brand-sub" aria-hidden="true">
      <span class="brand-sub-bracket">[</span>
      <span>Director</span>
      <span class="brand-sub-dot">·</span>
      <span>Specialty Camera</span>
      <span class="brand-sub-bracket">]</span>
    </span>
  </a>

  <div class="menu-flat">
    <a class="menu-flat-link" href="index.html">Home</a>
    <span class="menu-flat-sep">/</span>
    <a class="menu-flat-link is-current" href="work.html">Work</a>
    <span class="menu-flat-sep">/</span>
    <a class="menu-flat-link" href="about.html">About</a>
    <span class="menu-flat-sep">/</span>
    <a class="menu-flat-link" id="contactLink" href="mailto:hello@mikebecker.com">Contact</a>
  </div>
</nav>

<!-- ====== WORK MAIN ====== -->
<main class="work-main" id="workMain">
  <!-- Sections inserted by JS, one per role group with at least one project.
       Each section has a label band (alternating left/right alignment) and
       a grid of tiles below it. -->
</main>

<!-- ====== LIGHTBOX ====== -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <span class="lightbox-close-line"></span>
    <span class="lightbox-close-line"></span>
  </button>
  <div class="lightbox-frame">
    <div class="lightbox-meta">
      <h3 class="lightbox-title" id="lightboxTitle"></h3>
    </div>
    <div class="lightbox-player">
      <video id="lightboxVideo" controls playsinline preload="metadata"></video>
      <span class="lightbox-role" id="lightboxRole"></span>
    </div>
  </div>
</div>

<script>
/* ============================================================
   WORK PAGE
   Loads content/site.txt, builds role-grouped sections of tiles,
   and wires up tile hover (preview) and click (lightbox) behavior.

   The order of sections is fixed: Director, Cinematographer,
   Specialty Camera. Sections only render when at least one
   project has the matching role; an empty section renders nothing.
   ============================================================ */
(function() {

  const ROLE_ORDER = ['Director', 'Specialty Camera', 'Operator'];

  // Read site.txt and parse into a flat key/value map.
  async function loadConfig() {
    try {
      const res = await fetch('content/site.txt', { cache: 'no-cache' });
      if (!res.ok) return {};
      const text = await res.text();
      const cfg = {};
      text.split(/\r?\n/).forEach(line => {
        const trimmed = line.split('#')[0].trim();
        if (!trimmed) return;
        const idx = trimmed.indexOf('=');
        if (idx === -1) return;
        const key = trimmed.slice(0, idx).trim();
        const val = trimmed.slice(idx + 1).trim();
        cfg[key] = val;
      });
      return cfg;
    } catch (e) {
      console.warn('site.txt load failed', e);
      return {};
    }
  }

  // Resolve a file value into a usable src. If the value contains a
  // slash, treat it as a full path from root. Otherwise, look for it
  // inside media/work-N/.
  function resolveSrc(value, defaultFolder) {
    if (!value) return '';
    if (value.indexOf('/') !== -1) return value;
    return defaultFolder + '/' + value;
  }

  // Collect all configured WORK projects, in numeric order.
  function collectProjects(cfg) {
    const projects = [];
    let missCount = 0;
    for (let n = 1; n < 200 && missCount < 12; n++) {
      const file  = cfg['WORK_' + n + '_FILE'];
      const full  = cfg['WORK_' + n + '_FULL'];
      const title = cfg['WORK_' + n + '_TITLE'];
      const role  = cfg['WORK_' + n + '_ROLE'];
      const wide  = (cfg['WORK_' + n + '_WIDE'] || '').toLowerCase() === 'true';
      if (file && full && title && role) {
        projects.push({ n, file, full, title, role, wide });
        missCount = 0;
      } else {
        missCount++;
      }
    }
    return projects;
  }

  // Group projects by role, in the canonical order. Only roles that
  // have at least one project end up with a section.
  function groupByRole(projects) {
    const groups = [];
    ROLE_ORDER.forEach(role => {
      const matches = projects.filter(p => p.role === role);
      if (matches.length > 0) groups.push({ role, projects: matches });
    });
    return groups;
  }

  // Build the DOM: a sequence of <section> elements, each with a
  // section-head label and a tile grid.
  function buildPage(groups) {
    const main = document.getElementById('workMain');
    if (!main) return;
    main.innerHTML = '';

    groups.forEach((group) => {
      const section = document.createElement('section');
      section.className = 'work-section';
      section.setAttribute('data-role', group.role);

      // Sticky label wrapper. Sits at top of section in normal flow
      // until scrolled past, then sticks below the nav in the upper
      // right of the viewport. Travels back up with the section as
      // it leaves view, while the next section's label fades in.
      const labelWrap = document.createElement('div');
      labelWrap.className = 'work-section-sticky';
      labelWrap.innerHTML = '<span class="work-section-label">' + group.role + '</span>';
      section.appendChild(labelWrap);

      // Grid of tiles for this section.
      const grid = document.createElement('div');
      grid.className = 'work-grid';

      group.projects.forEach(p => {
        const fileSrc = resolveSrc(p.file, 'media/work-' + p.n);
        const fullSrc = resolveSrc(p.full, 'media/work-' + p.n);

        const tile = document.createElement('a');
        tile.className = 'tile' + (p.wide ? ' is-wide' : '');
        tile.href = '#';
        tile.setAttribute('data-slot', 'work-' + p.n);
        tile.setAttribute('data-full', fullSrc);
        tile.setAttribute('data-title', p.title);
        tile.setAttribute('data-role', p.role);

        tile.innerHTML =
          '<div class="tile-media">' +
            '<video preload="metadata" muted loop playsinline disablepictureinpicture>' +
              '<source src="' + fileSrc + '" type="video/mp4">' +
            '</video>' +
          '</div>' +
          '<div class="tile-overlay">' +
            '<span class="tile-overlay-title">' + p.title + '</span>' +
          '</div>';

        grid.appendChild(tile);
      });

      section.appendChild(grid);
      main.appendChild(section);
    });
  }

  // Hover play/pause for tile videos. On mouseenter, play. On
  // mouseleave, pause and reset to first frame for a clean idle state.
  function wireTileHover() {
    document.querySelectorAll('.work-grid .tile').forEach(tile => {
      const video = tile.querySelector('video');
      if (!video) return;
      tile.addEventListener('mouseenter', () => {
        video.play().catch(() => {});
      });
      tile.addEventListener('mouseleave', () => {
        video.pause();
        try { video.currentTime = 0; } catch (e) {}
      });
    });
  }

  // Wire the sticky role labels with scroll-driven blur and opacity.
  //
  // The CSS handles the spatial behavior: each label is position:sticky
  // top:50vh with a -50% Y translate, so its center aligns with the
  // vertical center of the viewport while in its section.
  //
  // This function handles the visual handoff between sections. On every
  // scroll frame, each label's distance from viewport center is measured.
  // Within the sharp zone (close to center), the label is opaque and
  // unblurred. Beyond that, opacity falls off and blur ramps up until
  // the fade-end distance, where the label is fully transparent and
  // heavily blurred. The crossfade at the section boundary happens
  // automatically: as the outgoing label is pushed up away from center
  // (blurring out), the incoming label arrives at center (sharpening in).
  function wireStickyLabels() {
    const labels = document.querySelectorAll('.work-section-label');
    if (!labels.length) return;

    function update() {
      const vc = window.innerHeight / 2;
      // Sharp zone: within 8% of viewport height of center, label is
      // fully sharp. Beyond fade-end (32% of viewport height), label
      // is fully blurred and transparent. Between, linear interpolation.
      const sharpZone = window.innerHeight * 0.08;
      const fadeEnd  = window.innerHeight * 0.32;

      labels.forEach(label => {
        const rect = label.getBoundingClientRect();
        const center = rect.top + rect.height / 2;
        const distance = Math.abs(center - vc);

        let t = 0; // 0 = sharp, 1 = fully faded
        if (distance > sharpZone) {
          t = Math.min((distance - sharpZone) / (fadeEnd - sharpZone), 1);
        }

        const opacity = 1 - t;
        const blur = t * 14;

        label.style.opacity = opacity.toFixed(3);
        label.style.filter = blur > 0.1 ? 'blur(' + blur.toFixed(1) + 'px)' : 'none';
      });
    }

    let ticking = false;
    function schedule() {
      if (!ticking) {
        requestAnimationFrame(() => { update(); ticking = false; });
        ticking = true;
      }
    }

    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', schedule);
    update();
  }

  // Lightbox open/close and content swap.
  function wireLightbox() {
    const lightbox      = document.getElementById('lightbox');
    const lightboxVideo = document.getElementById('lightboxVideo');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxRole  = document.getElementById('lightboxRole');
    const closeBtn      = document.getElementById('lightboxClose');

    function openLightbox(src, title, role) {
      lightboxVideo.src = src;
      lightboxTitle.textContent = title || '';
      lightboxRole.textContent = role || '';
      lightbox.setAttribute('aria-hidden', 'false');
      lightboxVideo.play().catch(() => {});
    }
    function closeLightbox() {
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxVideo.pause();
      lightboxVideo.src = '';
    }

    document.querySelectorAll('.work-grid .tile').forEach(tile => {
      tile.addEventListener('click', (e) => {
        e.preventDefault();
        openLightbox(
          tile.getAttribute('data-full'),
          tile.getAttribute('data-title'),
          tile.getAttribute('data-role')
        );
      });
    });
    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  }

  // Wire the contact link from site.txt EMAIL (with fallback).
  function wireContact(cfg) {
    const email = cfg.EMAIL;
    if (!email) return;
    const link = document.getElementById('contactLink');
    if (link) link.href = 'mailto:' + email;
  }

  // Fade out the page cover after content is built.
  function revealPage() {
    requestAnimationFrame(() => {
      const cover = document.getElementById('pageCover');
      if (cover) cover.classList.add('gone');
    });
  }

  async function init() {
    const cfg = await loadConfig();
    const projects = collectProjects(cfg);
    const groups = groupByRole(projects);
    buildPage(groups);
    wireTileHover();
    wireStickyLabels();
    wireLightbox();
    wireContact(cfg);
    revealPage();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
