<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0B09">
<title>Work — Mike Becker</title>
<meta name="description" content="Selected work. Mike Becker. Director and Specialty Camera based in Los Angeles." />
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

<style>
/* ======================================================
   ROOT TOKENS
   Inherits the same visual language as index.html so the
   site reads as one coherent piece. Edit values here only
   if the homepage tokens change.
====================================================== */
:root {
  --bg:           #0C0B09;
  --bg-2:         #161513;
  --fg:           #F4F1EB;
  --fg-dim:       #D9D5CC;
  --muted:        #8A867D;
  --accent-warm:  #C8B69A;

  /* Horizontal gutter for tile gaps and section padding. Matches
     the homepage exactly so the work page feels continuous with the
     rest of the site. */
  --edge:        clamp(8px, 1vw, 14px);

  /* Nav gutter — wider than --edge so the nav contents sit comfortably
     in from the page edges. */
  --nav-edge:    clamp(16px, 1.8vw, 28px);

  --radius:      clamp(8px, 0.9vw, 14px);
  --nav-h:       64px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-feature-settings: "ss01", "cv11";
  margin: 0;
  padding: 0;
  /* No overflow-x:hidden here. That CSS property creates a new
     scroll context on the root, which silently breaks
     position:sticky against the page scroll. If horizontal
     overflow ever needs to be tamed, do it on a non-ancestor
     wrapper of the sticky elements, or use overflow-x:clip
     (which doesn't break sticky). */
}

body {
  /* The page cover fades on load to mask reflow. Mirrors the
     homepage handoff so navigation between pages feels continuous. */
}

a { color: inherit; text-decoration: none; }

/* ======================================================
   NAV — flat horizontal menu
   Brand on the left (name + role tagline that appears on hover).
   Flat horizontal nav on the right: Home / Work / About / Contact.
   No collapsible menu, no burger. The functional elements are
   visible at all times because top-tier director sites do not
   hide their navigation on desktop.
====================================================== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--nav-edge);
  pointer-events: none;
}
.nav > * { pointer-events: auto; }

/* Brand — same DOM and styles as the homepage so the upper-left
   identity is identical between pages. */
.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
}
.brand-name {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 28;
  font-weight: 500;
  font-size: 16px;
  letter-spacing: -0.005em;
  line-height: 1;
  text-transform: uppercase;
}
.brand-sub {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1),
              transform 320ms cubic-bezier(.22,.61,.36,1);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.72);
  line-height: 1;
  white-space: nowrap;
}
.brand:hover .brand-sub {
  opacity: 1;
  transform: translateX(0);
}
.brand-sub-bracket,
.brand-sub-dot {
  opacity: 0.55;
}

/* Flat nav — premium typographic menu, no toggle. Each item is
   small caps, wide tracking, with slashes between to echo the
   bracketed brand-sub typography. The current-page item gets
   full white; others sit at a slightly muted opacity. */
.menu-flat {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
}
.menu-flat-link {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  line-height: 1;
  color: rgba(255,255,255,0.72);
  transition: color 240ms cubic-bezier(.22,.61,.36,1);
  padding: 4px 2px;
}
.menu-flat-link:hover { color: #fff; }
.menu-flat-link.is-current { color: #fff; }
.menu-flat-sep {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: rgba(255,255,255,0.4);
  line-height: 1;
}

/* ======================================================
   PAGE COVER — fades out on load to mask any reflow during
   font loading and content injection.
====================================================== */
.page-cover {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 400;
  pointer-events: none;
  opacity: 1;
  transition: opacity 520ms cubic-bezier(.22,.61,.36,1);
}
.page-cover.gone { opacity: 0; }

/* ======================================================
   WORK PAGE
   Grid of project thumbnails, grouped into sections by role.

   Each section has a sticky role label (Director, Cinematographer,
   Specialty Camera) that sits in the upper-right of the viewport,
   below the nav. The label appears as you scroll into a section,
   stays sticky over that section's tiles, then fades out and
   travels up with the section as it leaves the viewport. The next
   section's label fades in as that section enters. Pattern adapted
   from director / commercial roster sites (Park Pictures and
   similar) where the persistent label tells the viewer what role
   was played across everything currently in view.

   Within each section, tiles default to 16:9 standard tiles that
   pair 2-up. Tiles marked WIDE=true in site.txt span the full
   width of the section as a 2.39:1 cinemascope frame. The user
   curates the rhythm by deciding which tiles are wide.
====================================================== */
.work-main {
  /* No padding-top. The nav is fixed and floats over the content
     with text shadows for legibility — same treatment as the
     homepage hero. The first section's hero tile starts at y=0
     and the nav reads on top of it. */
  padding-bottom: clamp(60px, 8vw, 120px);
}

.work-section {
  position: relative;
  margin-top: var(--edge);
  /* No isolation, no z-index. The section stays in the root
     stacking context so that the labels (appended in a sibling
     layer after all sections) can blend with this section's
     tiles via mix-blend-mode. */
}
/* The first section sits flush against the top of the viewport
   so its hero tile extends behind the floating nav. */
.work-section:first-child {
  margin-top: 0;
}

/* The labels layer is a non-positioned wrapper inserted as the
   LAST child of <main>, after every section. Because it isn't
   positioned and has no isolation, it does NOT create a stacking
   context, and its children share the root stacking context with
   the section tiles. This is the property that makes
   mix-blend-mode actually invert tile pixels behind the text. */
.work-labels-layer {
  /* Intentionally empty — no positioning, no isolation. */
}

/* Each label is positioned against the VIEWPORT (position: fixed)
   with its top set per scroll frame by JS. The label is appended
   to the end of <main>, after every section, so in tree order it
   paints LAST in the root stacking context's step 6 — on top of
   every tile, regardless of section structure. There is no
   z-index, no isolation, and no stacking-context-creating ancestor
   above it, so mix-blend-mode: difference blends the white text
   against the composited tile pixels in the root context's
   backdrop. The result: legible white-on-dark, dark-on-light text
   that adapts continuously over varied imagery, never hidden
   behind a tile.

   JS positions the label so that:
   - When the section's bounds contain the viewport center, the
     label is centered vertically on 50vh.
   - When the section is leaving up top, the label tracks the
     section's bottom edge (label bottom = section bottom), so it
     never dips below the section.
   - When the section is entering from below, the label sits at
     the section's top edge.
   - When the section is fully out of viewport, opacity drops to 0. */
.work-section-label {
  position: fixed;
  left: var(--nav-edge);
  /* top is set by JS each frame */
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-size: clamp(18px, 2vw, 28px);
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #fff;
  line-height: 1;
  white-space: nowrap;
  mix-blend-mode: difference;
  pointer-events: none;
  opacity: 0;
  filter: blur(8px);
  /* The filter (blur) is set inline by JS each scroll frame as a
     continuous function of scroll position. We deliberately leave
     no time-based CSS transition on filter — the cross-fade should
     follow the scroll exactly, not run on its own clock. Stop the
     scroll and the cross-fade stops in place. Only opacity has a
     time-based transition (for fade in/out when a section enters
     or leaves the viewport). */
  transition: opacity 220ms cubic-bezier(.22,.61,.36,1),
              top 0s;
  will-change: opacity, filter, top;
}

/* The grid within a section. On desktop we use a 12-column grid
   so each section can compose its own rhythm. Every row is always
   filled completely by equal-width tiles, so the tile-to-tile gaps
   stay consistent everywhere. Creative variation comes from row
   composition (hero, pair, trio, banner) and aspect ratios — not
   from leaving empty grid space. */
.work-grid {
  display: grid;
  gap: var(--edge);
  padding: 0 var(--edge);
  grid-template-columns: 1fr;
}
@media (min-width: 760px) {
  .work-grid { grid-template-columns: repeat(12, 1fr); }
}

.work-grid .tile {
  position: relative;
  display: block;
  overflow: hidden;
  background: var(--bg-2);
  border-radius: var(--radius);
  cursor: pointer;
}
.work-grid .tile-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

@media (min-width: 760px) {
  /* Default tile: half-width pair tile, 16:9 */
  .work-grid .tile { grid-column: span 6; }

  /* Hero: full row, 2.39:1 cinemascope */
  .work-grid .tile.is-hero,
  .work-grid .tile.is-wide {
    grid-column: 1 / -1;
  }
  .work-grid .tile.is-hero .tile-media,
  .work-grid .tile.is-wide .tile-media {
    aspect-ratio: 2.39 / 1;
  }

  /* Third: 4 wide, used in trios of three across one row */
  .work-grid .tile.is-third { grid-column: span 4; }

  /* Asymmetric pair: 2/3 + 1/3 split.
     The dominant tile is 8/12 wide at 16:9 (standard landscape).
     The minor tile is 4/12 wide with aspect 8:9 — slightly taller
     than square — chosen specifically so its rendered HEIGHT
     equals the dominant tile's height. This means the row fills
     completely with no whitespace below the smaller tile.

     Math: dominant height = 8/12 * gw * 9/16 = 0.375 * gw.
           minor height (must match)         = 0.375 * gw.
           minor width = 4/12 * gw           = 0.333 * gw.
           minor aspect (width / height)     = 0.333 / 0.375 = 8/9.

     The 16:9 video inside the minor tile crops via object-fit:
     cover. This is intentional editorial framing — the narrower
     tile reads as a tighter, more composed shot next to its
     wider landscape partner. Top portfolio sites use this pattern
     to create visual rhythm rather than rows of identical tiles. */
  .work-grid .tile.is-major { grid-column: span 8; }
  .work-grid .tile.is-minor { grid-column: span 4; }
  .work-grid .tile.is-minor .tile-media {
    aspect-ratio: 8 / 9;
  }

  /* Banner: full row but a wider/shorter aspect (3:1) than the hero.
     Used as the closing tile of the Director section — same width
     as the hero but visibly less tall, which is what reads as
     "less prominent" without leaving any empty grid space. */
  .work-grid .tile.is-banner {
    grid-column: 1 / -1;
  }
  .work-grid .tile.is-banner .tile-media {
    aspect-ratio: 3 / 1;
  }
}

/* A section with only one tile auto-promotes that tile to a hero
   so it doesn't sit alone in a single half column. */
@media (min-width: 760px) {
  .work-grid:has(.tile:only-child) .tile {
    grid-column: 1 / -1;
  }
  .work-grid:has(.tile:only-child) .tile .tile-media {
    aspect-ratio: 2.39 / 1;
  }
}

/* Tile video / placeholder behavior — same as homepage. The
   video starts paused, autoplays muted on hover. Slight scale
   transform on the placeholder for a gentle hover-bloom. */
.tile-media video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transform: scale(1.02);
  transition: transform 700ms cubic-bezier(.22,.61,.36,1);
}
.tile:hover .tile-media video {
  transform: scale(1.0);
}

/* Tile overlay - title text floating over the lower-right of the
   tile, hidden by default and revealed on hover. The whole overlay
   (gradient scrim + title text) cross-fades together so when no
   tile is hovered the page is pure imagery; hovering any tile
   reveals that one project's title with its scrim. Position is
   lower-right per your direction, so it doesn't compete with the
   sticky section label in the upper-right corner. */
.tile-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: clamp(14px, 1.8vw, 24px) clamp(16px, 2vw, 28px);
  background: linear-gradient(to top, rgba(12,11,9,0.55) 0%, rgba(12,11,9,0) 100%);
  pointer-events: none;
  text-align: right;
  opacity: 0;
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1);
}
.tile:hover .tile-overlay {
  opacity: 1;
}
.tile-overlay-title {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 28;
  font-weight: 500;
  font-size: clamp(16px, 1.6vw, 24px);
  letter-spacing: -0.005em;
  line-height: 1;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4);
}

/* ======================================================
   LIGHTBOX — full-screen project player. Same DOM and
   behavior as the homepage so the click-into-project
   experience is identical across the site.
====================================================== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(8, 7, 6, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1);
}
.lightbox[aria-hidden="false"] {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-frame {
  width: min(94vw, 1400px);
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 1.6vw, 24px);
}
.lightbox-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  color: #fff;
  font-family: 'Inter', sans-serif;
}
.lightbox-title {
  margin: 0;
  font-variation-settings: "opsz" 32;
  font-weight: 500;
  font-size: clamp(18px, 1.8vw, 26px);
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.lightbox-player {
  position: relative;
  width: 100%;
  background: #000;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius);
  overflow: hidden;
}
.lightbox-player video {
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}
.lightbox-role {
  position: absolute;
  right: clamp(12px, 1.4vw, 22px);
  bottom: clamp(12px, 1.4vw, 22px);
  font-family: 'Inter', sans-serif;
  font-size: clamp(10px, 0.8vw, 12px);
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.78);
  padding: 6px 10px;
  background: rgba(0,0,0,0.4);
  border-radius: 999px;
  pointer-events: none;
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
}

.lightbox-close {
  position: absolute;
  top: clamp(14px, 1.6vw, 22px);
  right: clamp(14px, 1.6vw, 22px);
  width: 36px; height: 36px;
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 0;
}
.lightbox-close-line {
  position: absolute;
  top: 50%; left: 6px; right: 6px;
  height: 1.5px;
  background: rgba(255,255,255,0.85);
  transform-origin: center;
}
.lightbox-close-line:nth-child(1) { transform: rotate(45deg); }
.lightbox-close-line:nth-child(2) { transform: rotate(-45deg); }
</style>

</head>
<body>

<div class="page-cover" id="pageCover" aria-hidden="true"></div>

<!-- ====== NAV ====== -->
<nav class="nav" aria-label="Primary">
  <a href="index.html" class="brand" aria-label="Home">
    <span class="brand-name">Mike Becker</span>
    <span class="brand-sub" aria-hidden="true">
      <span class="brand-sub-bracket">[</span>
      <span>Director</span>
      <span class="brand-sub-dot">·</span>
      <span>Specialty Camera</span>
      <span class="brand-sub-bracket">]</span>
    </span>
  </a>

  <div class="menu-flat">
    <a class="menu-flat-link" href="index.html">Home</a>
    <span class="menu-flat-sep">/</span>
    <a class="menu-flat-link is-current" href="work.html">Work</a>
    <span class="menu-flat-sep">/</span>
    <a class="menu-flat-link" href="about.html">About</a>
    <span class="menu-flat-sep">/</span>
    <a class="menu-flat-link" id="contactLink" href="mailto:hello@mikebecker.com">Contact</a>
  </div>
</nav>

<!-- ====== WORK MAIN ====== -->
<main class="work-main" id="workMain">
  <!-- Sections inserted by JS, one per role group with at least one project.
       Each section has a label band (alternating left/right alignment) and
       a grid of tiles below it. -->
</main>

<!-- ====== LIGHTBOX ====== -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <span class="lightbox-close-line"></span>
    <span class="lightbox-close-line"></span>
  </button>
  <div class="lightbox-frame">
    <div class="lightbox-meta">
      <h3 class="lightbox-title" id="lightboxTitle"></h3>
    </div>
    <div class="lightbox-player">
      <video id="lightboxVideo" controls playsinline preload="metadata"></video>
      <span class="lightbox-role" id="lightboxRole"></span>
    </div>
  </div>
</div>

<script>
/* ============================================================
   WORK PAGE
   Loads content/site.txt, builds role-grouped sections of tiles,
   and wires up tile hover (preview) and click (lightbox) behavior.

   The order of sections is fixed: Director, Cinematographer,
   Specialty Camera. Sections only render when at least one
   project has the matching role; an empty section renders nothing.
   ============================================================ */
(function() {

  const ROLE_ORDER = ['Director', 'Specialty Camera', 'Operator'];

  // Read site.txt and parse into a flat key/value map.
  async function loadConfig() {
    try {
      const res = await fetch('content/site.txt', { cache: 'no-cache' });
      if (!res.ok) return {};
      const text = await res.text();
      const cfg = {};
      text.split(/\r?\n/).forEach(line => {
        const trimmed = line.split('#')[0].trim();
        if (!trimmed) return;
        const idx = trimmed.indexOf('=');
        if (idx === -1) return;
        const key = trimmed.slice(0, idx).trim();
        const val = trimmed.slice(idx + 1).trim();
        cfg[key] = val;
      });
      return cfg;
    } catch (e) {
      console.warn('site.txt load failed', e);
      return {};
    }
  }

  // Resolve a file value into a usable src. If the value contains a
  // slash, treat it as a full path from root. Otherwise, look for it
  // inside media/work-N/.
  function resolveSrc(value, defaultFolder) {
    if (!value) return '';
    if (value.indexOf('/') !== -1) return value;
    return defaultFolder + '/' + value;
  }

  // Collect all configured WORK projects, in numeric order.
  function collectProjects(cfg) {
    const projects = [];
    let missCount = 0;
    for (let n = 1; n < 200 && missCount < 12; n++) {
      const file  = cfg['WORK_' + n + '_FILE'];
      const full  = cfg['WORK_' + n + '_FULL'];
      const title = cfg['WORK_' + n + '_TITLE'];
      const role  = cfg['WORK_' + n + '_ROLE'];
      const wide  = (cfg['WORK_' + n + '_WIDE'] || '').toLowerCase() === 'true';
      if (file && full && title && role) {
        projects.push({ n, file, full, title, role, wide });
        missCount = 0;
      } else {
        missCount++;
      }
    }
    return projects;
  }

  // Group projects by role, in the canonical order. Only roles that
  // have at least one project end up with a section.
  function groupByRole(projects) {
    const groups = [];
    ROLE_ORDER.forEach(role => {
      const matches = projects.filter(p => p.role === role);
      if (matches.length > 0) groups.push({ role, projects: matches });
    });
    return groups;
  }

  // Build the DOM: a sequence of <section> elements, each with a
  // section-head label and a tile grid.
  // Each section composes its 4 tiles into a curated layout that
  // always fills every row completely (no whitespace within rows).
  // The position-layout map below defines the class assigned to
  // each slot in the section. An empty string means use the
  // default tile style (half-width pair tile, 16:9).
  //
  //   Director           tile 1: hero (cinematic full-width opener)
  //                      tile 2: half (left of pair)
  //                      tile 3: half (right of pair)
  //                      tile 4: banner (full-width but shorter 3:1
  //                              aspect — less prominent than the hero,
  //                              still fills the row)
  //
  //   Specialty Camera   tile 1: hero (cinematic full-width opener)
  //                      tile 2: third (4-wide trio)
  //                      tile 3: third
  //                      tile 4: third
  //
  //   Operator           tile 1: third (4-wide trio)
  //                      tile 2: third
  //                      tile 3: third
  //                      tile 4: hero (full-width closer)
  //
  // A tile marked WORK_N_WIDE=true in site.txt is promoted to
  // the section's hero slot regardless of where it appears in
  // numeric order. Non-WIDE tiles fill the remaining slots in
  // their natural order. This lets the editor pick the hero of a
  // section without having to renumber projects.
  const LAYOUT_BY_ROLE = {
    'Director':         ['is-hero',  'is-major', 'is-minor', 'is-banner'],
    'Specialty Camera': ['is-hero',  'is-third', 'is-third', 'is-third'],
    'Operator':         ['is-third', 'is-third', 'is-third', 'is-hero']
  };

  function buildPage(groups) {
    const main = document.getElementById('workMain');
    if (!main) return;
    main.innerHTML = '';

    groups.forEach((group) => {
      const section = document.createElement('section');
      section.className = 'work-section';
      section.setAttribute('data-role', group.role);

      const grid = document.createElement('div');
      grid.className = 'work-grid';

      const layout = LAYOUT_BY_ROLE[group.role] || [];
      const heroIdx = layout.indexOf('is-hero');

      // A tile marked WIDE in site.txt becomes this section's hero.
      // Other tiles fill the remaining slots in numeric order.
      const heroProject = group.projects.find(p => p.wide);
      const others = heroProject
        ? group.projects.filter(p => p !== heroProject)
        : group.projects.slice();

      // Walk the layout slots and assign a project to each.
      const slotted = [];
      let othersIdx = 0;
      for (let i = 0; i < layout.length; i++) {
        if (i === heroIdx && heroProject) {
          slotted.push({ project: heroProject, cls: layout[i] });
        } else if (othersIdx < others.length) {
          slotted.push({ project: others[othersIdx], cls: layout[i] });
          othersIdx++;
        }
      }
      // Any additional projects beyond layout length fall through
      // with the default class (half-width pair tile).
      while (othersIdx < others.length) {
        slotted.push({ project: others[othersIdx], cls: '' });
        othersIdx++;
      }

      slotted.forEach((entry) => {
        const p = entry.project;
        const cls = entry.cls;
        const fileSrc = resolveSrc(p.file, 'media/work-' + p.n);
        const fullSrc = resolveSrc(p.full, 'media/work-' + p.n);

        const tile = document.createElement('a');
        tile.className = 'tile' + (cls ? ' ' + cls : '');
        tile.href = '#';
        tile.setAttribute('data-slot', 'work-' + p.n);
        tile.setAttribute('data-full', fullSrc);
        tile.setAttribute('data-title', p.title);
        tile.setAttribute('data-role', p.role);

        tile.innerHTML =
          '<div class="tile-media">' +
            '<video preload="metadata" muted loop playsinline disablepictureinpicture>' +
              '<source src="' + fileSrc + '" type="video/mp4">' +
            '</video>' +
          '</div>' +
          '<div class="tile-overlay">' +
            '<span class="tile-overlay-title">' + p.title + '</span>' +
          '</div>';

        grid.appendChild(tile);
      });

      section.appendChild(grid);
      main.appendChild(section);
    });

    // Labels layer. Appended AFTER all sections so that, in the
    // root stacking context's tree-order traversal, labels are
    // painted LAST, on top of every tile. The layer itself is a
    // non-positioned <div> with no isolation, so it does NOT
    // create a stacking context. Each label inside is position:
    // fixed (positioned against the viewport, controlled by JS)
    // and uses mix-blend-mode: difference. Because the layer
    // doesn't create a stacking context, the labels share the
    // root stacking context with the section tiles, which is
    // exactly what mix-blend-mode needs in order to blend against
    // the tile pixels behind it.
    const labelsLayer = document.createElement('div');
    labelsLayer.className = 'work-labels-layer';
    groups.forEach((group) => {
      const label = document.createElement('span');
      label.className = 'work-section-label';
      label.setAttribute('data-role', group.role);
      label.textContent = group.role;
      labelsLayer.appendChild(label);
    });
    main.appendChild(labelsLayer);
  }

  // Hover play/pause for tile videos. On mouseenter, play. On
  // mouseleave, pause and reset to first frame for a clean idle state.
  function wireTileHover() {
    document.querySelectorAll('.work-grid .tile').forEach(tile => {
      const video = tile.querySelector('video');
      if (!video) return;
      tile.addEventListener('mouseenter', () => {
        video.play().catch(() => {});
      });
      tile.addEventListener('mouseleave', () => {
        video.pause();
        try { video.currentTime = 0; } catch (e) {}
      });
    });
  }

  // Wire the labels.
  //
  // Labels are NOT inside their sections any more. They live in a
  // sibling .work-labels-layer container appended after every
  // section, with position: fixed. This guarantees they paint
  // after every tile in the root stacking context and can never
  // be hidden behind a thumbnail.
  //
  // For each frame this function:
  //   1. Finds the section's current bounding rect in viewport.
  //   2. Decides where the corresponding label should sit:
  //      - Section fully out of viewport: hidden.
  //      - Section's top is below viewport center: label tracks
  //        the section's top edge plus an inset (so the label
  //        sits a little below the top, breathing room from the
  //        gap line above).
  //      - Section's bottom is above viewport center: label
  //        tracks the section's bottom edge minus an inset (so
  //        the label sits a little above the bottom, equal
  //        breathing room to the gap line below).
  //      - Section straddles viewport center with enough room:
  //        label is centered on 50vh.
  //   3. Decides the label's blur state:
  //      - Section contains viewport center: filter: none (sharp).
  //      - In viewport but does NOT contain center: filter: blur(8px).
  //      - Out of viewport: hidden (opacity 0).
  //
  // The thresholds that switch the label between "tracking an
  // edge" and "centered on 50vh" are shifted by the same inset
  // value, so the label's position is continuous (no jump) at
  // those transitions.
  //
  // Two adjacent labels are visible at the same time during a
  // boundary crossing — one sharp, one blurred — and the cross-fade
  // happens via the CSS transition on filter. They are never both
  // sharp simultaneously.
  function wireStickyLabels() {
    const sections = document.querySelectorAll('.work-section');
    if (!sections.length) return;

    // Pair each section with its corresponding label, matched by
    // the data-role attribute.
    const pairs = [];
    sections.forEach(section => {
      const role = section.getAttribute('data-role');
      if (!role) return;
      const label = document.querySelector(
        '.work-section-label[data-role="' + role + '"]'
      );
      if (label) pairs.push({ section: section, label: label });
    });
    if (!pairs.length) return;

    // labelH: the label's rendered height. Needed to clamp its
    // position to the section's bounds.
    // labelPad: breathing room between the label and the section's
    // top or bottom edge, kept equal at both ends so the label
    // reads as having the same gap above the next-section line
    // as the next section's label has below it.
    let labelH = 24;
    let labelPad = 16;
    function measureLayout() {
      labelH = pairs[0].label.offsetHeight || 24;
      labelPad = Math.max(14, Math.min(22, Math.round(window.innerWidth * 0.013)));
    }

    function update() {
      const vh = window.innerHeight;
      const vc = vh / 2;
      const halfLabel = labelH / 2;
      const PAD = labelPad;

      // Scroll-driven cross-fade.
      //
      // The blur on each label is computed continuously from the
      // current scroll position. As the user scrolls a section
      // toward the viewport center, that section's label gains
      // focus weight (blur decreases toward 0); the section being
      // left behind loses weight (blur increases toward 8). The
      // cross-fade is therefore tied to scroll, not to a timer.
      //
      // For each pair of adjacent sections (i, i+1), define a
      // handoff parameter t in [0, 1]:
      //   t = 0 when the next section's top is far below center
      //         (specifically at vc + Z, where Z is the transition
      //         zone size).
      //   t = 1 when the next section's top has reached the
      //         position where its label settles at viewport center
      //         (vc - halfLabel - PAD). Aligning t=1 with the
      //         position-clamp threshold means the blur transition
      //         and the position transition complete on the same
      //         scroll frame.
      // Linear interpolation in between.
      //
      // Each section's focal weight is then:
      //   w_0       = 1 - t_{0,1}
      //   w_k (mid) = t_{k-1,k} - t_{k,k+1}
      //   w_N       = t_{N-1,N}
      // These sum to 1 at all times, so as one label gains weight
      // an adjacent label loses an equal amount.
      //
      // The label's blur in pixels is 8 * (1 - w).
      const Z = vh * 0.15;
      const START_TOP = vc + Z;
      const END_TOP = vc - halfLabel - PAD;
      const DENOM = Math.max(1, START_TOP - END_TOP);

      const ts = [];
      for (let i = 0; i < pairs.length - 1; i++) {
        const nextRect = pairs[i + 1].section.getBoundingClientRect();
        const raw = (START_TOP - nextRect.top) / DENOM;
        ts.push(Math.max(0, Math.min(1, raw)));
      }

      const weights = [];
      for (let i = 0; i < pairs.length; i++) {
        let w;
        if (pairs.length === 1) {
          w = 1;
        } else if (i === 0) {
          w = 1 - ts[0];
        } else if (i === pairs.length - 1) {
          w = ts[i - 1];
        } else {
          w = ts[i - 1] - ts[i];
        }
        weights.push(Math.max(0, Math.min(1, w)));
      }

      pairs.forEach(function (pair, i) {
        const section = pair.section;
        const label = pair.label;
        const rect = section.getBoundingClientRect();

        const inViewport = rect.top < vh && rect.bottom > 0;

        if (!inViewport) {
          label.style.opacity = '0';
          label.style.filter = 'blur(8px)';
          return;
        }

        // Position: clamp to section bounds with equal inset.
        let labelTop;
        if (rect.top > vc - halfLabel - PAD) {
          labelTop = rect.top + PAD;
        } else if (rect.bottom < vc + halfLabel + PAD) {
          labelTop = rect.bottom - labelH - PAD;
        } else {
          labelTop = vc - halfLabel;
        }

        label.style.top = labelTop + 'px';
        label.style.opacity = '1';

        // Blur: derived from the focal weight.
        const w = weights[i];
        const blurPx = 8 * (1 - w);
        label.style.filter = blurPx < 0.15
          ? 'none'
          : 'blur(' + blurPx.toFixed(2) + 'px)';
      });
    }

    let ticking = false;
    function schedule() {
      if (!ticking) {
        requestAnimationFrame(function () { update(); ticking = false; });
        ticking = true;
      }
    }

    measureLayout();
    update();
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', function () {
      measureLayout();
      schedule();
    });
  }

  // Lightbox open/close and content swap.
  function wireLightbox() {
    const lightbox      = document.getElementById('lightbox');
    const lightboxVideo = document.getElementById('lightboxVideo');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxRole  = document.getElementById('lightboxRole');
    const closeBtn      = document.getElementById('lightboxClose');

    function openLightbox(src, title, role) {
      lightboxVideo.src = src;
      lightboxTitle.textContent = title || '';
      lightboxRole.textContent = role || '';
      lightbox.setAttribute('aria-hidden', 'false');
      lightboxVideo.play().catch(() => {});
    }
    function closeLightbox() {
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxVideo.pause();
      lightboxVideo.src = '';
    }

    document.querySelectorAll('.work-grid .tile').forEach(tile => {
      tile.addEventListener('click', (e) => {
        e.preventDefault();
        openLightbox(
          tile.getAttribute('data-full'),
          tile.getAttribute('data-title'),
          tile.getAttribute('data-role')
        );
      });
    });
    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  }

  // Wire the contact link from site.txt EMAIL (with fallback).
  function wireContact(cfg) {
    const email = cfg.EMAIL;
    if (!email) return;
    const link = document.getElementById('contactLink');
    if (link) link.href = 'mailto:' + email;
  }

  // Fade out the page cover after content is built.
  function revealPage() {
    requestAnimationFrame(() => {
      const cover = document.getElementById('pageCover');
      if (cover) cover.classList.add('gone');
    });
  }

  async function init() {
    const cfg = await loadConfig();
    const projects = collectProjects(cfg);
    const groups = groupByRole(projects);
    buildPage(groups);
    wireTileHover();
    wireStickyLabels();
    wireLightbox();
    wireContact(cfg);
    revealPage();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
