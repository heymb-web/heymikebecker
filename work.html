<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MIKE BECKER / WORK</title>
<meta name="description" content="Mike Becker. Selected directing and cinematography work." />
<meta name="theme-color" content="#0C0B09" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />

<style>
/* ======================================================
   TOKENS
====================================================== */
:root {
  --bg:     #0C0B09;
  --bg-2:   #131210;
  --fg:     #EDE6D8;
  --fg-dim: #B6AF9F;
  --muted:  #6A655B;
  --line:   rgba(237, 230, 216, 0.10);
  /* Header background when locked to the page (panel area). 80% opacity
     so the underlying page color shows through subtly. */
  --nav-bg: rgba(12, 11, 9, 0.80);

  /* Horizontal gutter for tile gaps and section padding. Smaller,
     so tiles can sit close together. */
  --edge: clamp(8px, 1vw, 14px);

  /* Larger gutter just for the nav (brand and burger breathing room
     from the page edges). Doesn't affect tile spacing. */
  --nav-edge: clamp(16px, 1.8vw, 28px);

  /* Height of the fixed nav bar at the top. Used to push the hero
     and any sticky content down by this amount so they don't sit
     behind the nav. */
  --nav-h: 60px;

  --buffer: 15vh;

  --t-fast: 220ms cubic-bezier(.22,.61,.36,1);
  --t-mid:  420ms cubic-bezier(.22,.61,.36,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 400;
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 0;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* No top padding: the nav floats transparently over the hero
     using mix-blend-mode: difference. The hero begins at y=0. */
}
a { color: inherit; text-decoration: none; }
img, video { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

/* ======================================================
   GRAIN
====================================================== */
.grain {
  position: fixed; inset: -50%;
  width: 200%; height: 200%;
  pointer-events: none;
  z-index: 100;
  opacity: 0.09;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  animation: grainShift 7s steps(8) infinite;
}
@keyframes grainShift {
  0%   { transform: translate(0, 0); }
  20%  { transform: translate(-3%, 4%); }
  40%  { transform: translate(5%, -2%); }
  60%  { transform: translate(-4%, -3%); }
  80%  { transform: translate(2%, 5%); }
  100% { transform: translate(0, 0); }
}

/* ======================================================
   NAV — uses --edge for left/right padding so the brand
   sits on the same left axis as "Selected Works" and the grid.
====================================================== */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 200;
  height: var(--nav-h);
  padding: 0 var(--nav-edge);
  display: flex; align-items: center; justify-content: space-between;
  /* Transparent: the nav floats over the content. Text and burger
     are solid white with a soft drop shadow for readability against
     varied backgrounds (matches the Park Pictures treatment). */
  background: transparent;
  pointer-events: none;
}
/* Restore clickability for the actual links inside the nav. */
.nav a,
.nav button,
.nav .menu-wrap {
  pointer-events: auto;
}

.brand {
  display: flex;
  align-items: baseline;
  white-space: nowrap;
  gap: 0.5em;
  position: relative;
}
.brand-name {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 32;
  /* Uppercase, slightly bolder, mild positive tracking. Matches the
     Park Pictures treatment — confident, declarative, masthead. */
  font-weight: 600;
  font-size: clamp(18px, 1.4vw, 22px);
  letter-spacing: 0.01em;
  text-transform: uppercase;
  line-height: 1;
  color: #fff;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* Brand-sub reveal — a quiet fade-in on hover. The full label
   "[ Director · Cinematographer ]" appears together as one piece,
   no stagger, no slide. Treats the secondary text as supplementary
   information that reveals when the wordmark is attended to. */
.brand-sub {
  display: inline-flex;
  align-items: baseline;
  gap: 0.4em;
  margin-left: clamp(10px, 0.8vw, 16px);
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 18;
  font-weight: 400;
  font-size: clamp(11px, 0.8vw, 13px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.65);
  pointer-events: none;
  line-height: 1;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 420ms cubic-bezier(.22,.61,.36,1);
}
.brand-sub-bracket,
.brand-sub-dot {
  color: rgba(255, 255, 255, 0.4);
}
.brand:hover .brand-sub {
  opacity: 1;
}

/* ======================================================
   MENU
====================================================== */
.menu-wrap { display: flex; align-items: center; gap: 14px; }

.menu-stack {
  position: relative;
  height: clamp(14px, 1.05vw, 17px);
  /* No fixed width and no overflow clipping. The menu items are
     absolutely positioned to the right and pre-laid out; they just
     toggle visibility via opacity, not width. */
}

.menu-label,
.menu {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 18;
  font-size: clamp(15px, 1.1vw, 18px);
  font-weight: 500;
  letter-spacing: 0;
  /* Plain sentence case as written in the HTML: "Home", "Work",
     "About", "Contact". No caps transformation. */
  text-transform: none;
  color: #fff;
  line-height: 1;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* "MENU" label fades out as items fade in. */
.menu-label {
  opacity: 1;
  transition: opacity 200ms cubic-bezier(.22,.61,.36,1);
}
.menu-wrap.open .menu-label { opacity: 0; }

.menu {
  gap: 14px;
  pointer-events: none;
}
.menu-wrap.open .menu { pointer-events: auto; }

/* Each child of .menu (links + separators) slides in from a small
   right offset while fading in. Stagger goes right-to-left so the
   rightmost item moves first and the leftmost last. */
.menu > * {
  opacity: 0;
  transform: translateX(14px);
  transition: opacity 480ms cubic-bezier(.22,.61,.36,1),
              transform 520ms cubic-bezier(.22,.61,.36,1);
}
.menu-wrap.open .menu > * {
  opacity: 1;
  transform: translateX(0);
}
.menu-wrap.open .menu > *:nth-child(7) { transition-delay: 60ms; }
.menu-wrap.open .menu > *:nth-child(6) { transition-delay: 110ms; }
.menu-wrap.open .menu > *:nth-child(5) { transition-delay: 160ms; }
.menu-wrap.open .menu > *:nth-child(4) { transition-delay: 210ms; }
.menu-wrap.open .menu > *:nth-child(3) { transition-delay: 260ms; }
.menu-wrap.open .menu > *:nth-child(2) { transition-delay: 310ms; }
.menu-wrap.open .menu > *:nth-child(1) { transition-delay: 360ms; }

.menu .sep {
  color: rgba(255, 255, 255, 0.35);
  user-select: none;
  font-style: normal;
}

.menu a {
  position: relative;
  padding: 2px 0;
  color: #fff;
  text-decoration: none;
  display: inline-block;
  transition:
    opacity 480ms cubic-bezier(.22,.61,.36,1),
    transform 520ms cubic-bezier(.22,.61,.36,1);
}
/* Subtle underline that draws in from the left on hover. Italic
   serif text doesn't transition weight nicely (not a variable font),
   so the indicator is a thin underline that grows under the word. */
.menu a::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;
  height: 1px;
  background: #fff;
  transform-origin: left center;
  transform: scaleX(0);
  transition: transform 420ms cubic-bezier(.22,.61,.36,1);
}
.menu a:hover::after { transform: scaleX(1); }

.burger {
  width: 36px; height: 36px;
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-end;
  gap: 8px;
  cursor: pointer;
  flex-shrink: 0;
  background: transparent;
  border: none;
  position: relative;
  z-index: 1;
}
.burger span {
  display: block;
  height: 1.5px;
  background: #fff;
  border-radius: 1px;
  filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.55));
  transition: transform 420ms cubic-bezier(.22,.61,.36,1),
              width 420ms cubic-bezier(.22,.61,.36,1),
              opacity 240ms ease;
  transform-origin: center;
}
/* Uneven lines: top is full-width (22px), bottom is shorter (14px).
   Right-aligned via the flex container so the difference reads as
   intentional rather than arbitrary. */
.burger span:nth-child(1) { width: 22px; }
.burger span:nth-child(2) { width: 14px; }
/* Open: both lines become equal width and rotate into an X. */
.menu-wrap.open .burger span:nth-child(1) {
  width: 22px;
  transform: translateY(5px) rotate(45deg);
}
.menu-wrap.open .burger span:nth-child(2) {
  width: 22px;
  transform: translateY(-5px) rotate(-45deg);
}

@media (max-width: 720px) {
  .menu-label, .menu { font-size: 13px; letter-spacing: 0.06em; }
  .menu { gap: 9px; }
}

/* ======================================================
   HERO — in document flow, edge-to-edge
====================================================== */
.hero {
  /* Fills the full viewport. The nav floats transparently over the
     top edge using mix-blend-mode: difference, so the reel runs all
     the way to the top of the page. */
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}
.hero-media {
  position: absolute;
  inset: 0;
  overflow: hidden;
  /* Sharp corners. The hero IS the page edge; rounding here would
     contradict the full-bleed geometry. Tiles keep their radius
     because they're floating objects, not page-edge elements. */
  border-radius: 0;
}
/* Inner wrapper holds the video and placeholder. The scroll-driven
   parallax (scale, translate, opacity) applies to THIS element, so
   the outer .hero-media frame stays the same size as the reel
   recedes. */
.hero-inner {
  position: absolute;
  inset: 0;
  transform-origin: center center;
  will-change: transform, opacity;
}
/* Hero poster: a canvas that JS paints with the reel's first frame.
   Sits above the video. Starts solid black (covers the empty hero
   while the video loads in the background). Once JS has painted the
   first frame, the canvas shows that frame. Fades out via .gone
   once the video is playing. */
.hero-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  z-index: 2;
  opacity: 1;
  transition: opacity 400ms cubic-bezier(.22,.61,.36,1);
}
.hero-poster.gone {
  opacity: 0;
}
/* Caption strip in the dark gap between the hero and the grid.
   Right-aligned to the same gutter as the tiles. Two-tone: primary
   role in white, secondary in muted gray. */
.hero-caption {
  display: flex;
  justify-content: flex-end;
  padding: clamp(10px, 1.2vw, 16px) var(--edge);
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 18, "wght" 500;
  font-size: clamp(11px, 0.85vw, 13px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--bg);
}
.hero-caption .role-primary { color: #fff; }
.hero-caption .role-sep { color: rgba(255, 255, 255, 0.35); margin: 0 0.5em; }
.hero-caption .role-secondary { color: rgba(255, 255, 255, 0.48); }
.hero-media .placeholder { position: absolute; inset: 0; }
.hero-media .featured-ph {
  background: linear-gradient(135deg, #1c1915 0%, #3a2c1f 40%, #1d1812 70%, #2a2218 100%);
  background-size: 220% 220%;
  animation: drift 14s ease-in-out infinite alternate;
}
.hero-media .featured-ph::before {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  opacity: 0.25;
  mix-blend-mode: overlay;
}
@keyframes drift {
  0%   { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}

/* ======================================================
   OVERLAY — sits below the hero in document flow
====================================================== */
.overlay {
  position: relative;
  z-index: 2;
  background: var(--bg);
  padding-top: var(--edge);
}

/* ======================================================
   SECTION TITLE — sits just below the top of the panel
====================================================== */
.section-title {
  padding: clamp(80px, 10vw, 160px) var(--edge) clamp(40px, 5vw, 72px);
}
.section-title h2 {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 32, "wght" 700;
  font-weight: 700;
  font-size: clamp(48px, 9vw, 140px);
  line-height: 0.92;
  letter-spacing: -0.035em;
  color: var(--fg);
  margin: 0;
  text-transform: uppercase;
  /* Dissolve reveal: hidden + blurred + slightly offset until in view */
  opacity: 0;
  filter: blur(10px);
  transform: translateY(10px);
  transition: opacity 900ms cubic-bezier(.22,.61,.36,1),
              filter 900ms cubic-bezier(.22,.61,.36,1),
              transform 900ms cubic-bezier(.22,.61,.36,1);
  will-change: opacity, filter, transform;
}
.section-title h2.revealed {
  opacity: 1;
  filter: blur(0);
  transform: translateY(0);
}

/* ======================================================
   GRID
====================================================== */
.grid {
  padding: 0 var(--edge) clamp(40px, 6vw, 80px);
  display: grid;
  gap: var(--edge);
}
.grid-row { display: grid; gap: var(--edge); grid-template-columns: 1fr; }
@media (min-width: 760px) {
  .row-2 { grid-template-columns: 1fr 1fr; }
  /* The first row is intentionally asymmetric: tile-1 takes 2/3 of
     the width (landscape), tile-2 takes 1/3 (portrait, 4:5). The
     portrait sibling determines the row's height; the wide tile
     stretches to match instead of leaving a gap below itself. */
  .grid-row.row-asym {
    grid-template-columns: 2fr 1fr;
  }
  .grid-row.row-asym .tile { height: 100%; }
  .grid-row.row-asym .tile:nth-child(1) .tile-media {
    aspect-ratio: auto;
    height: 100%;
  }
  .grid-row.row-asym .tile:nth-child(2) .tile-media {
    aspect-ratio: 4 / 5;
  }
  /* Flipped asymmetric row: portrait on the LEFT, landscape on the
     RIGHT. Used for later cycles so the work grid alternates rhythm
     instead of repeating the same composition. */
  .grid-row.row-asym.row-asym-flip {
    grid-template-columns: 1fr 2fr;
  }
  .grid-row.row-asym.row-asym-flip .tile:nth-child(1) .tile-media {
    aspect-ratio: 4 / 5;
    height: auto;
  }
  .grid-row.row-asym.row-asym-flip .tile:nth-child(2) .tile-media {
    aspect-ratio: auto;
    height: 100%;
  }
  /* Full-width closer row: a single cinematic 2.39:1 tile that acts
     as the punctuation at the end of the work grid. Wider than the
     16:9 tiles above so the closer is visually distinct, not just
     "the same tile bigger." */
  .row-1 .tile-media {
    aspect-ratio: 2.39 / 1;
  }
}

.tile {
  position: relative;
  display: block;
  overflow: hidden;
  background: var(--bg-2);
  border-radius: clamp(8px, 0.9vw, 14px);
  cursor: pointer;
}
.tile-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

/* Embedded video elements behave exactly like the placeholders they
   replace: cover the parent, inherit the same hover transforms via the
   shared .placeholder class. */
.placeholder, .tile-media video, .hero-media video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

.placeholder {
  /* Default: slightly zoomed in so the image overfills the frame.
     On hover it relaxes to a smaller scale, but stays above 1 so the
     frame is never exposed. */
  transform: scale(1.05);
  transform-origin: center center;
  transition: transform 700ms cubic-bezier(.22,.61,.36,1),
              filter    520ms cubic-bezier(.22,.61,.36,1);
}
.placeholder::before {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
  opacity: 0.3;
  mix-blend-mode: overlay;
  pointer-events: none;
}

/* Preview placeholders (.tile-ph, .hero-placeholder)
   ------------------------------------------------------
   These sit behind the video elements. When the video has no source
   or hasn't loaded yet, the placeholder shows through. When a real
   video file loads, it covers the placeholder. Each has a slow
   gradient drift to feel like ambient footage rather than a flat
   color block, so you can preview the site locally without uploading
   any videos. */
.tile-ph,
.hero-placeholder {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-size: 220% 220%;
  animation: ph-drift 16s ease-in-out infinite alternate;
}
.tile-media {
  position: relative;
}
.tile-media video,
.hero-media video {
  position: absolute;
  inset: 0;
  z-index: 1;
}

@keyframes ph-drift {
  0%   { background-position: 0% 30%; }
  100% { background-position: 100% 70%; }
}

.hero-placeholder {
  background:
    radial-gradient(ellipse at 30% 40%, rgba(80, 110, 140, 0.4) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(120, 90, 70, 0.35) 0%, transparent 60%),
    linear-gradient(160deg, #0e1418 0%, #1a2530 55%, #08090c 100%);
}

.t1 .tile-ph { background: linear-gradient(160deg, #10131a 0%, #1d2a3a 55%, #0a0d12 100%); }
.t2 .tile-ph { background: linear-gradient(120deg, #1a1612 0%, #482e1e 45%, #170e07 100%); }
.t3 .tile-ph { background: linear-gradient(140deg, #131618 0%, #28383b 55%, #0c0f10 100%); }
.t4 .tile-ph { background: linear-gradient(145deg, #1a1812 0%, #3b2d18 55%, #14100a 100%); }
.t5 .tile-ph { background: linear-gradient(150deg, #181a14 0%, #2f3a25 50%, #0f120c 100%); }
.t6 .tile-ph { background: linear-gradient(125deg, #181418 0%, #3a2236 55%, #100a10 100%); }

.t1 .placeholder { background: linear-gradient(160deg, #10131a 0%, #1d2a3a 55%, #0a0d12 100%); }
.t2 .placeholder { background: linear-gradient(120deg, #1a1612 0%, #482e1e 45%, #170e07 100%); }
.t3 .placeholder { background: linear-gradient(140deg, #131618 0%, #28383b 55%, #0c0f10 100%); }
.t4 .placeholder { background: linear-gradient(145deg, #1a1812 0%, #3b2d18 55%, #14100a 100%); }
.t5 .placeholder { background: linear-gradient(150deg, #181a14 0%, #2f3a25 50%, #0f120c 100%); }
.t6 .placeholder { background: linear-gradient(125deg, #181418 0%, #3a2236 55%, #100a10 100%); }

/* Tile videos and placeholders: subtle scale on hover, no blur. */
.tile-media video,
.tile-media .tile-ph,
.tile-media .placeholder {
  transform: scale(1.02);
  transform-origin: center center;
  transition: transform 700ms cubic-bezier(.22,.61,.36,1);
}
.tile:hover .tile-media video,
.tile:hover .tile-media .tile-ph,
.tile:hover .tile-media .placeholder {
  transform: scale(1.04);
}

/* Hover treatment: a warm amber color cast washes over the tile,
   rather than a generic dark tint. Same affordance (the tile is
   reacting to your cursor) but with character — a small piece of
   color in an otherwise monochrome page. */
.tile-media::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 2;
  background: rgba(220, 140, 80, 0.22);
  mix-blend-mode: multiply;
  opacity: 0;
  transition: opacity 360ms cubic-bezier(.22,.61,.36,1);
  pointer-events: none;
}
.tile:hover .tile-media::after {
  opacity: 1;
}

/* Hover overlay — title sits in the lower-left, slides up from the bottom */
.tile-overlay {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: clamp(16px, 2vw, 28px) clamp(18px, 2.2vw, 30px);
  z-index: 5;
  pointer-events: none;
  text-align: left;
}
.tile-overlay-line {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
  line-height: 1;
}
.tile-overlay-title {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 18;
  /* Uppercase with light positive tracking. Weight 500 (not bold)
     keeps the type confident but quiet, matching the Park Pictures
     treatment. Larger than the nav brand so the project name reads
     as the primary mark on each tile. */
  font-weight: 500;
  font-size: clamp(22px, 1.85vw, 30px);
  letter-spacing: 0.04em;
  line-height: 1;
  text-transform: uppercase;
  /* Solid white + soft drop shadow stays readable against any image
     pixel without picking up the background tint. */
  color: #fff;
  text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.45);
  transform: translateY(105%);
  opacity: 0;
  transition: transform 540ms cubic-bezier(.22,.61,.36,1) 80ms,
              opacity 280ms ease 140ms;
}
.tile:hover .tile-overlay-title {
  transform: translateY(0);
  opacity: 1;
}

/* Role label in the upper-right of each tile (Director, Operator, etc).
   Sits diagonally opposite the title. Smaller and lighter than the
   title so it reads as a credit, not a competing mark. Slides down
   from above on hover, mirroring the title's slide-up from below. */
.tile-overlay-role {
  position: absolute;
  top: clamp(16px, 2vw, 28px);
  right: clamp(18px, 2.2vw, 30px);
  z-index: 5;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 14;
  font-weight: 500;
  font-size: clamp(11px, 0.85vw, 14px);
  letter-spacing: 0.16em;
  line-height: 1;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6), 0 1px 2px rgba(0, 0, 0, 0.45);
  pointer-events: none;
  transform: translateY(-115%);
  opacity: 0;
  transition: transform 540ms cubic-bezier(.22,.61,.36,1) 80ms,
              opacity 280ms ease 140ms;
}
.tile:hover .tile-overlay-role {
  transform: translateY(0);
  opacity: 1;
}

/* ======================================================
   INTRO — dissolve, then nav slides down
   The site loads with a black overlay covering everything. The
   overlay dissolves quickly, revealing the hero video. After the
   video has been playing for a beat, the brand and menu slide
   down from the top and fade in.
====================================================== */

body.intro-active { overflow: hidden; }

/* The intro: blurred and zoomed-in poster, snaps to sharp + normal
   scale in a single 150ms cubic motion. Both filter and transform
   transition together — reads as one decisive snap, not two cues. */
body.intro-active .hero-inner {
  filter: blur(28px) saturate(0.95) brightness(0.98);
  transform: scale(1.07);
}
.hero-inner {
  transition: filter 150ms cubic-bezier(.65,0,.35,1),
              transform 150ms cubic-bezier(.65,0,.35,1);
}

/* Large wordmark that sits in the upper-left during the intro
   sequence. Same typographic treatment as the small nav brand
   (Inter weight 600, uppercase, mild positive tracking) so the
   small one reads as a direct scaled-down version. */
.intro-mark {
  position: fixed;
  top: var(--nav-edge);
  left: var(--nav-edge);
  z-index: 300;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 32;
  font-weight: 600;
  font-size: clamp(56px, 9vw, 140px);
  letter-spacing: 0.01em;
  text-transform: uppercase;
  line-height: 0.92;
  color: #fff;
  pointer-events: none;
  mix-blend-mode: difference;
  opacity: 1;
  transition: opacity 450ms cubic-bezier(.22,.61,.36,1);
}
.intro-mark.gone { opacity: 0; }

/* Brand and menu are held hidden during the intro (both .intro-active
   and the handoff window). They fade/slide into place after the large
   wordmark has dissolved. */
.brand, .menu-wrap {
  transition:
    opacity 700ms cubic-bezier(.22,.61,.36,1),
    transform 800ms cubic-bezier(.22,.61,.36,1);
}
body.intro-active .brand,
body.intro-active .menu-wrap,
body.intro-handoff .brand,
body.intro-handoff .menu-wrap {
  opacity: 0;
  transform: translateY(-28px);
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .intro-mark { display: none !important; }
  body.intro-active .brand,
  body.intro-active .menu-wrap {
    opacity: 1 !important;
    transform: none !important;
  }
  body.intro-active { overflow: auto !important; }
}

/* ====== LIGHTBOX ======
   Full-screen overlay for project playback. Sits above everything,
   centers the player, dims the page behind. */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(8, 7, 5, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(40px, 5vw, 80px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 320ms cubic-bezier(.22,.61,.36,1);
}
.lightbox.open {
  opacity: 1;
  pointer-events: auto;
}
body.lightbox-open { overflow: hidden; }

.lightbox-frame {
  width: 100%;
  max-width: 1400px;
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 1.4vw, 22px);
  transform: translateY(20px);
  transition: transform 380ms cubic-bezier(.22,.61,.36,1);
}
.lightbox.open .lightbox-frame { transform: translateY(0); }

.lightbox-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.lightbox-title {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 24;
  font-weight: 600;
  font-size: clamp(18px, 1.6vw, 26px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: #fff;
  margin: 0;
}
/* Role credit sits inside the player at the bottom right. */
.lightbox-role {
  position: absolute;
  right: clamp(14px, 1.4vw, 22px);
  bottom: clamp(12px, 1.2vw, 20px);
  z-index: 3;
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 14;
  font-weight: 400;
  font-size: clamp(11px, 0.85vw, 14px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.85);
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7), 0 1px 2px rgba(0, 0, 0, 0.5);
  margin: 0;
  white-space: nowrap;
  pointer-events: none;
}

.lightbox-player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: clamp(6px, 0.7vw, 10px);
  overflow: hidden;
}
.lightbox-player video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

/* Close button — top-right corner, X icon */
.lightbox-close {
  position: absolute;
  top: clamp(20px, 2vw, 32px);
  right: clamp(20px, 2vw, 32px);
  width: 32px;
  height: 32px;
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 0;
  z-index: 510;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lightbox-close-line {
  position: absolute;
  width: 22px;
  height: 1.5px;
  background: #fff;
  transition: background 200ms ease;
}
.lightbox-close-line:nth-child(1) { transform: rotate(45deg); }
.lightbox-close-line:nth-child(2) { transform: rotate(-45deg); }
.lightbox-close:hover .lightbox-close-line { background: rgba(255,255,255,0.7); }

/* ======================================================
   WORK PAGE
   Park Pictures-style work index. A clean uniform grid of
   16:9 thumbnails with the title and role set as a refined
   caption below each tile, both visible at rest. Hover plays
   the loop. Click opens the lightbox. Generous gaps and side
   gutters carry the editorial weight; the project IS the
   moment, not the chrome around it.
====================================================== */
.work-main {
  /* Generous breathing room above the grid so it doesn't crash
     into the nav. Nav height plus a comfortable visual gutter. */
  padding-top: calc(var(--nav-h) + clamp(56px, 8vw, 120px));
  padding-bottom: clamp(80px, 10vw, 160px);
  background: var(--bg);
  position: relative;
  z-index: 1;
}

.work-grid {
  /* Side gutters that feel architectural, not template-y.
     Bigger than the home grid's edge so the work page reads as
     curated, not packed. */
  padding: 0 clamp(20px, 4vw, 64px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  /* Wide gap between tiles. The whitespace does a lot of the
     "this is serious work" lift. */
  column-gap: clamp(20px, 3vw, 48px);
  row-gap: clamp(56px, 7vw, 100px);
}
@media (max-width: 720px) {
  .work-grid {
    grid-template-columns: 1fr;
    padding: 0 var(--edge);
    row-gap: clamp(40px, 6vw, 64px);
  }
}

/* A work item: the tile + its caption stacked vertically. */
.work-item {
  display: block;
  text-decoration: none;
  color: inherit;
}

.work-item .tile-media {
  aspect-ratio: 16 / 9;
  position: relative;
  overflow: hidden;
  background: var(--bg-2);
}
.work-item .tile-media video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* Subtle hover lift: the tile slightly brightens and the video
   itself plays. No transform — keeps the grid lines tidy. */
.work-item .tile-media::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0);
  transition: background 320ms cubic-bezier(.22,.61,.36,1);
  pointer-events: none;
}
.work-item:hover .tile-media::after {
  background: rgba(255, 255, 255, 0.04);
}

/* Caption: title left, role right, baseline-aligned. The slash
   between them is part of the typography, not a separator span. */
.work-item-caption {
  margin-top: clamp(14px, 1.4vw, 22px);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.5em;
  font-family: 'Inter', sans-serif;
  line-height: 1.1;
}
.work-item-title {
  font-variation-settings: "opsz" 18;
  font-weight: 500;
  font-size: clamp(16px, 1.25vw, 20px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--fg);
  /* Long titles wrap; the role stays anchored to the right. */
  flex: 1 1 auto;
  min-width: 0;
}
.work-item-role {
  font-variation-settings: "opsz" 14;
  font-weight: 400;
  font-size: clamp(12px, 0.95vw, 15px);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-dim);
  flex: 0 0 auto;
  white-space: nowrap;
}
.work-item:hover .work-item-title {
  color: #fff;
}

/* Page cover: opaque black overlay that fades out on load.
   Replaces the elaborate hero-intro from the home page with a
   quiet fade. */
.page-cover {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 400;
  pointer-events: none;
  opacity: 1;
  transition: opacity 600ms cubic-bezier(.22,.61,.36,1);
}
.page-cover.gone {
  opacity: 0;
}

</style>
</head>
<body class="work-page">

<!-- Smooth fade-in cover. Removed by JS once content is ready. -->
<div class="page-cover" id="pageCover" aria-hidden="true"></div>

<div class="grain" aria-hidden="true"></div>

<!-- ====== NAV ====== -->
<nav class="nav">
  <a href="index.html" class="brand" aria-label="Home">
    <span class="brand-name" data-cfg="name">Mike Becker</span>
    <span class="brand-sub" aria-hidden="true">
      <span class="brand-sub-item brand-sub-bracket">[</span>
      <span class="brand-sub-item">Director</span>
      <span class="brand-sub-item brand-sub-dot">·</span>
      <span class="brand-sub-item">Cinematographer</span>
      <span class="brand-sub-item brand-sub-bracket">]</span>
    </span>
  </a>

  <div class="menu-wrap" id="menuWrap">
    <div class="menu-stack">
      <nav class="menu" aria-label="Primary">
        <a href="index.html" data-text="Home">Home</a>
        <span class="sep">/</span>
        <a href="work.html" data-text="Work">Work</a>
        <span class="sep">/</span>
        <a href="about.html" data-text="About">About</a>
        <span class="sep">/</span>
        <a href="mailto:hello@example.com" data-text="Contact" data-cfg-email>Contact</a>
      </nav>
    </div>
    <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
    </button>
  </div>
</nav>

<!-- ====== WORK PAGE MAIN ====== -->
<main class="work-main">

  <!-- ====== WORK GRID ======
       Rendered by JS from WORK_N_* blocks in content/site.txt.
       Each project: 16:9 thumbnail tile (hover plays the loop),
       caption below with title on the left and role on the right.
       Empty / commented-out blocks are skipped, so the page only
       shows projects that are fully filled in. -->
  <section class="work-grid" id="workGrid" aria-label="Selected work">
    <!-- Tiles inserted here by JS. -->
  </section>

</main>


<!-- ====== PROJECT LIGHTBOX ======
     Opens when a tile is clicked. Plays the full project video from
     the matching media/tile-N/ folder. Closes on Escape, click outside
     the player, or the close button. -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <span class="lightbox-close-line"></span>
    <span class="lightbox-close-line"></span>
  </button>
  <div class="lightbox-frame">
    <div class="lightbox-meta">
      <h3 class="lightbox-title" id="lightboxTitle"></h3>
    </div>
    <div class="lightbox-player">
      <video id="lightboxVideo" controls playsinline preload="metadata"></video>
      <span class="lightbox-role" id="lightboxRole"></span>
    </div>
  </div>
</div>


<script>
  // ====== CONTENT LOADER ======
  // Reads content/site.txt and populates the page:
  // - identity (name, email)
  // - reels (DIRECTING_REEL_FILE, OPERATING_REEL_FILE)
  // - work projects (WORK_N_FILE, WORK_N_FULL, WORK_N_TITLE, WORK_N_ROLE)
  //
  // The work grid is rendered from scratch by JS based on whatever
  // WORK_N_* blocks exist in site.txt. Empty / missing blocks are
  // skipped, so the page only shows projects that are fully filled in.

  function parseConfig(text) {
    const cfg = {};
    text.split(/\r?\n/).forEach(line => {
      const t = line.trim();
      if (!t || t.startsWith('#')) return;
      let i = t.indexOf('=');
      if (i === -1) i = t.indexOf(':');
      if (i === -1) return;
      const key = t.slice(0, i).trim().toUpperCase();
      const val = t.slice(i + 1).trim();
      if (key) cfg[key] = val;
    });
    return cfg;
  }

  // Resolve a file value to a usable src path.
  // - If the value contains a slash, treat it as a path from site root.
  // - Otherwise, the value is a filename inside the given folder.
  function resolveSrc(value, folder) {
    if (!value) return '';
    if (value.indexOf('/') !== -1) return value.split('/').map(encodeURIComponent).join('/');
    return folder.replace(/\/$/, '') + '/' + encodeURIComponent(value);
  }

  // Build the work grid. Park Pictures-style uniform 2-column grid.
  // Each item is a 16:9 tile with title + role caption below.
  function buildWorkGrid(cfg) {
    const container = document.getElementById('workGrid');
    if (!container) return;

    // Collect available WORK_N projects. Numeric scan, stop after a
    // run of empty slots so we don't loop forever.
    const projects = [];
    let missCount = 0;
    for (let n = 1; n < 200 && missCount < 10; n++) {
      const file  = cfg[`WORK_${n}_FILE`];
      const full  = cfg[`WORK_${n}_FULL`];
      const title = cfg[`WORK_${n}_TITLE`];
      const role  = cfg[`WORK_${n}_ROLE`];
      if (file && full && title && role) {
        projects.push({ n, file, full, title, role });
        missCount = 0;
      } else {
        missCount++;
      }
    }

    if (!projects.length) return;

    container.innerHTML = '';
    projects.forEach((p) => {
      const fileSrc = resolveSrc(p.file, 'media/work-' + p.n);
      const fullSrc = resolveSrc(p.full, 'media/work-' + p.n);

      const item = document.createElement('a');
      item.className = 'work-item tile';
      item.setAttribute('href', '#');
      item.setAttribute('data-slot', 'work-' + p.n);
      item.setAttribute('data-full', fullSrc);
      item.setAttribute('data-role', p.role);

      item.innerHTML =
        '<div class="tile-media">' +
          '<video preload="metadata" muted loop playsinline disablepictureinpicture>' +
            '<source src="' + fileSrc + '" type="video/mp4">' +
          '</video>' +
        '</div>' +
        '<div class="work-item-caption">' +
          '<span class="work-item-title tile-overlay-title">' + p.title + '</span>' +
          '<span class="work-item-role">' + p.role + '</span>' +
        '</div>';

      container.appendChild(item);
    });
  }

  // Main initialization.
  (async function init() {
    let text = null;
    try {
      const r = await fetch('content/site.txt', { cache: 'no-cache' });
      if (r.ok) text = await r.text();
    } catch (e) {}

    if (text) {
      const cfg = parseConfig(text);
      window.__cfg = cfg;

      // Identity (brand name + contact email link)
      if (cfg.NAME) {
        document.querySelectorAll('[data-cfg="name"]').forEach(el => el.textContent = cfg.NAME);
      }
      if (cfg.EMAIL) {
        document.querySelectorAll('[data-cfg-email]').forEach(el => {
          el.setAttribute('href', 'mailto:' + cfg.EMAIL);
        });
      }

      // Work grid
      buildWorkGrid(cfg);
    }

    // Fade out the page cover once content is rendered.
    requestAnimationFrame(() => {
      const cover = document.getElementById('pageCover');
      if (cover) cover.classList.add('gone');
      // Remove after the transition completes.
      setTimeout(() => { if (cover && cover.parentNode) cover.remove(); }, 700);
    });

    // Wire up tile click -> lightbox AFTER the work grid has been
    // built. Reel tiles already exist in the DOM at page load, so
    // they're included here too.
    wireTileClicks();
    wireTileHover();
  })();

  // ====== LIGHTBOX ======
  (function setupLightbox() {
    const lightbox = document.getElementById('lightbox');
    const lightboxVideo = document.getElementById('lightboxVideo');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxRole = document.getElementById('lightboxRole');
    const lightboxClose = document.getElementById('lightboxClose');
    if (!lightbox || !lightboxVideo) return;

    window.__openLightbox = function (fullSrc, title, role) {
      if (!fullSrc) return;
      lightboxVideo.src = fullSrc;
      lightboxTitle.textContent = title || '';
      if (lightboxRole) lightboxRole.textContent = role || '';
      lightbox.classList.add('open');
      document.body.classList.add('lightbox-open');
      lightbox.setAttribute('aria-hidden', 'false');
      setTimeout(() => { lightboxVideo.play().catch(() => {}); }, 100);
    };

    function close() {
      lightbox.classList.remove('open');
      document.body.classList.remove('lightbox-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxVideo.pause();
      setTimeout(() => {
        lightboxVideo.removeAttribute('src');
        lightboxVideo.load();
      }, 400);
    }

    lightboxClose.addEventListener('click', close);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) close();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) close();
    });
  })();

  function wireTileClicks() {
    document.querySelectorAll('.tile[data-slot]').forEach(tile => {
      // Avoid double-binding if init is called twice.
      if (tile.__wired) return;
      tile.__wired = true;
      tile.addEventListener('click', (e) => {
        e.preventDefault();
        const fullSrc = tile.getAttribute('data-full');
        const titleEl = tile.querySelector('.tile-overlay-title');
        const title = titleEl ? titleEl.textContent.trim() : '';
        const role = tile.getAttribute('data-role') || '';
        if (fullSrc && window.__openLightbox) window.__openLightbox(fullSrc, title, role);
      });
    });
  }

  function wireTileHover() {
    const tileVideos = document.querySelectorAll('.tile-media video');
    tileVideos.forEach(v => {
      if (v.__hoverWired) return;
      v.__hoverWired = true;
      v.removeAttribute('autoplay');
      v.loop = true;
      v.muted = true;
      const seekFirstFrame = () => { try { v.currentTime = 0.001; } catch (e) {} };
      if (v.readyState >= 1) seekFirstFrame();
      else v.addEventListener('loadedmetadata', seekFirstFrame, { once: true });

      const tile = v.closest('.tile');
      if (!tile) return;
      tile.addEventListener('mouseenter', () => {
        try { v.currentTime = 0.001; } catch (e) {}
        v.play().catch(() => {});
      });
      tile.addEventListener('mouseleave', () => {
        v.pause();
        try { v.currentTime = 0.001; } catch (e) {}
      });
    });
  }

  // ====== MENU TOGGLE ======
  (function setupMenu() {
    const wrap = document.getElementById('menuWrap');
    const burger = document.getElementById('burger');
    if (!burger || !wrap) return;

    function setMenu(open) {
      wrap.classList.toggle('open', open);
      document.body.classList.toggle('menu-open', open);
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    burger.addEventListener('click', () => {
      setMenu(!wrap.classList.contains('open'));
    });
    wrap.querySelectorAll('.menu a').forEach(a =>
      a.addEventListener('click', () => setMenu(false))
    );
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && wrap.classList.contains('open')) {
        setMenu(false);
      }
    });
  })();

  // ====== NAV SCROLL STATE ======
  // The nav adds a .scrolled class once the user scrolls past a
  // threshold so it can pick up a background tint for legibility
  // (the same .scrolled rule from index.html applies).
  (function setupNavScroll() {
    const navEl = document.querySelector('.nav');
    if (!navEl) return;
    let ticking = false;
    function update() {
      const y = window.scrollY || window.pageYOffset || 0;
      navEl.classList.toggle('scrolled', y > 40);
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { requestAnimationFrame(update); ticking = true; }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    update();
  })();
</script>

</body>
</html>
