/* NAV */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--nav-h); z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--nav-edge);
  pointer-events: none;
}
.nav > * { pointer-events: auto; }
.brand { display: inline-flex; align-items: baseline; gap: 12px; color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35); }
.brand-name {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 32;
  font-weight: 600;
  font-size: clamp(18px, 1.4vw, 22px);
  letter-spacing: 0.01em; line-height: 1; text-transform: uppercase;
}
.brand-sub { display: none; }
.menu-flat { display: inline-flex; align-items: baseline; gap: 8px; color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35); }
.menu-flat-link {
  font-family: 'Inter', sans-serif;
  font-size: clamp(13px, 1.05vw, 16px); font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; line-height: 1;
  color: rgba(255,255,255,0.72);
  transition: color 240ms cubic-bezier(.22,.61,.36,1);
  padding: 4px 2px;
}
.menu-flat-link:hover, .menu-flat-link.is-current { color: #fff; }
.menu-flat-sep {
  font-family: 'Inter', sans-serif;
  font-size: clamp(13px, 1.05vw, 16px); font-weight: 400;
  color: rgba(255,255,255,0.4); line-height: 1;
}

/* ======================================================
   CONTACT — portrait + panel. The bio is hidden and reveals on
   hover over the portrait, straddling the photo's right edge
   (half on the photo, half off onto the dark negative space to
   the right). It uses mix-blend-mode: difference so it stays
   legible over the photo OR the dark page — the same readable-
   over-anything treatment as the work-page section labels.
====================================================== */
.contact-main {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: calc(var(--nav-h) + clamp(28px, 5vw, 56px))
           clamp(20px, 5vw, 64px) clamp(40px, 6vw, 80px);
}
.stage {
  position: relative;
  width: 100%; max-width: 1040px;
  display: grid; grid-template-columns: 1fr; gap: clamp(36px, 5vw, 64px);
}
@media (min-width: 860px) {
  .stage {
    grid-template-columns: 1fr minmax(420px, 1fr);
    align-items: center; gap: clamp(40px, 5vw, 72px);
  }
}

/* Panel (left): headline, details, form. */
.panel { position: relative; max-width: 460px; }
.panel-role {
  font-family: 'Inter', sans-serif;
  font-variation-settings: "opsz" 28;
  font-weight: 500;
  font-size: clamp(24px, 2.6vw, 38px);
  letter-spacing: -0.015em; line-height: 1.05;
  text-transform: none;
  color: var(--fg);
  margin: 0 0 1.6em;
}
/* Letterhead block, above the form. Three deliberate weights/sizes:
   a quiet locator eyebrow, the email as the prominent anchor, the
   phone as a soft footnote. Quietness is opacity, not colour, so the
   see-through blend stays intact. */
.details {
  display: flex; flex-direction: column;
  margin: 0 0 2.6em;
}
.details .loc {
  font-family: var(--mono);
  font-size: clamp(11px, 0.95vw, 13px);
  font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase;
  opacity: 0.55; margin: 0 0 1em; width: fit-content;
}
.details .email {
  font-family: 'Inter', sans-serif;
  font-size: clamp(19px, 2.1vw, 27px);
  font-weight: 400; letter-spacing: -0.012em; line-height: 1.1;
  width: fit-content;
}
.details .tel {
  font-family: var(--mono);
  font-size: clamp(13px, 1vw, 15px);
  font-weight: 400; letter-spacing: 0.05em;
  opacity: 0.6; margin: 0.7em 0 0; width: fit-content;
}
.details a { position: relative; }
.details a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 1px; background: #fff;
  transform: scaleX(0); transform-origin: left;
  transition: transform 320ms cubic-bezier(.22,.61,.36,1);
}
.details a:hover::after { transform: scaleX(1); }

/* Figure (right): portrait, left-aligned in its column so there's
   open dark space to its right for the bio to bleed into. */
.figure {
  position: relative;
  justify-self: start;
  width: 100%; max-width: 360px;
}
.figure-frame {
  position: relative; overflow: hidden; border-radius: 3px; background: var(--bg-2);
}
.figure-frame img {
  display: block; width: 100%; height: auto;
  filter: grayscale(1) contrast(0.94) brightness(0.86);
  transform: scale(1.01);
  transition: filter 700ms cubic-bezier(.22,.61,.36,1),
              transform 1200ms cubic-bezier(.22,.61,.36,1);
}
.figure:hover .figure-frame img,
.figure.is-near .figure-frame img {
  filter: grayscale(0) contrast(1) brightness(1);
  transform: scale(1.04);
}

/* Bio reveal — a sibling of .figure-frame (NOT inside it, so the frame's
   overflow:hidden can't clip it). It straddles the photo's right edge: the
   left part sits over the lower portion of the portrait, the right part
   hangs off into the dark negative space beside the photo.

   mix-blend-mode: difference makes it readable on both halves. Over the
   photo the white text inverts against the image; where it overhangs onto
   the dark page it reads as near-white on black, exactly like the nav
   wordmark. The rise on reveal is done with the `bottom` offset, NOT a
   transform: a transform (like opacity or filter) creates an isolated
   layer that breaks mix-blend-mode and leaves the text flat white. So the
   reveal uses only visibility + bottom, keeping the blend intact. */
.bio-reveal {
  position: absolute;
  left: 33%;
  right: -18%;
  bottom: clamp(16px, 6.5%, 46px);
  pointer-events: none;
  visibility: hidden;
  transition: bottom 560ms cubic-bezier(.22,.61,.36,1),
              visibility 0s linear 560ms;
}
.figure:hover .bio-reveal,
.figure.is-near .bio-reveal {
  visibility: visible;
  bottom: clamp(26px, 8%, 56px);
  transition: bottom 560ms cubic-bezier(.22,.61,.36,1),
              visibility 0s;
}
.bio-reveal p {
  margin: 0;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: clamp(13px, 1.15vw, 17px);
  line-height: 1.45;
  letter-spacing: 0.005em;
  text-align: left;
  color: #fff;
  mix-blend-mode: difference;
}

/* Reach-out form. */
.reach { position: relative; }
.reach-label {
  font-family: var(--mono);
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 1.6em;
  display: flex; align-items: center; gap: 0.9em;
}
.reach-label::before {
  content: ""; width: clamp(20px, 3vw, 40px); height: 1px; background: var(--line);
}
.reach-field { position: relative; margin-bottom: 1.5em; }
.reach-field input, .reach-field textarea {
  width: 100%; background: transparent; border: none;
  border-bottom: 1px solid var(--line);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: clamp(14px, 1.05vw, 16px); font-weight: 400; letter-spacing: 0.01em;
  padding: 0 0 0.55em; outline: none;
  transition: border-color 300ms cubic-bezier(.22,.61,.36,1); resize: none;
}
.reach-field textarea { line-height: 1.5; min-height: 2.1em; }
.reach-field input::placeholder, .reach-field textarea::placeholder { color: var(--muted); opacity: 1; }
.reach-field input:focus, .reach-field textarea:focus { border-bottom-color: var(--fg); }
.reach-send {
  appearance: none; background: transparent; border: none; cursor: pointer;
  font-family: var(--mono);
  font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--fg); padding: 0;
  display: inline-flex; align-items: center; gap: 0.7em;
  transition: gap 300ms cubic-bezier(.22,.61,.36,1);
}
.reach-send .arrow { display: inline-block; transition: transform 300ms cubic-bezier(.22,.61,.36,1); }
.reach-send:hover { gap: 1.1em; }
.reach-send:hover .arrow { transform: translateX(4px); }
.reach-send:disabled { color: var(--muted); cursor: default; }
.reach-status {
  margin-top: 1.4em; font-family: var(--mono);
  font-size: 12px; letter-spacing: 0.02em; line-height: 1.5;
  min-height: 1.2em; color: var(--fg-dim);
  opacity: 0; transition: opacity 300ms;
}
.reach-status.show { opacity: 1; }
.reach-status.error { color: #E0A89A; }

/* Load-in. The PANEL fades/rises in. The FIGURE only rises (no
   opacity animation) — animating opacity on the figure would create
   a stacking context that breaks the bio's mix-blend-mode against
   the portrait. So the figure uses transform only. */
.panel { opacity: 0; transform: translateY(14px); }
.figure { transform: translateY(14px); }
.is-loaded .figure {
  transform: translateY(0);
  transition: transform 900ms cubic-bezier(.22,.61,.36,1) 80ms;
}
.is-loaded .panel {
  opacity: 1; transform: translateY(0);
  transition: opacity 800ms cubic-bezier(.22,.61,.36,1) 220ms,
              transform 900ms cubic-bezier(.22,.61,.36,1) 220ms;
}
@media (prefers-reduced-motion: reduce) {
  .figure, .panel { opacity: 1; transform: none; }
}

/* ======================================================
   MOBILE / touch — no hover. The portrait shows in full color and
   the bio is always visible as normal readable prose below it (no
   overlap, no blend), since there's no cursor to reveal it.
====================================================== */
@media (max-width: 859px) {
  .figure { justify-self: center; max-width: 340px; }
  .figure-frame { overflow: visible; }
  .figure-frame img { filter: grayscale(0) contrast(1) brightness(1); transform: none; }
  .bio-reveal {
    position: static; visibility: visible; pointer-events: auto;
    transform: none; width: auto; margin-top: 1.6em;
    right: auto; bottom: auto; left: auto;
  }
  .bio-reveal p {
    mix-blend-mode: difference;
    color: #fff;
    font-weight: 500;
    text-align: left;
    font-size: clamp(15px, 4vw, 17px);
    line-height: 1.6;
  }
}
/* ===================================================================
   MOBILE HEADER — minimal bar + full-screen overlay menu.
   The full wordmark and horizontal menu are a desktop pattern that
   crowds a phone. On mobile the bar collapses to an "MB" monogram on
   the left and a small menu button on the right; tapping opens a
   full-screen overlay with large links. Reclaims the top so the work
   and reel breathe. Monogram + burger use the see-through treatment so
   they read over any background.
=================================================================== */
.brand-mono { display: none; }
.m-burger { display: none; }
.m-menu { display: none; }
.m-veil { display: none; }

@media (max-width: 720px) {
  /* Lock the page to the viewport: it cannot scroll at all, so the
     content is pinned below the nav and no text can ever pass behind
     the MIKE BECKER header / burger. */
  html, body { overflow: hidden; overscroll-behavior: none; }
  .contact-main {
    align-items: flex-start;
    min-height: 0;
    height: 100vh;
    height: 100svh;
  }
  .brand-name {
    display: inline-block;
    color: #fff;
    mix-blend-mode: difference !important;
  }
  .brand-sub { display: none; }
  .menu-flat { display: none; }

  .brand-mono {
    display: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.04em;
    line-height: 1;
    color: #fff;
    mix-blend-mode: difference;
  }

  .m-burger {
    display: inline-flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    width: 34px; height: 34px;
    padding: 0; margin: 0;
    background: none; border: 0; cursor: pointer;
    mix-blend-mode: difference;
  }
  .m-burger span {
    display: block; height: 2px; width: 28px; margin-left: auto;
    background: #fff; border-radius: 2px;
    transform-origin: center;
    transition: transform 320ms cubic-bezier(.22,.61,.36,1),
                opacity 220ms ease;
  }
  /* The hamburger IS the close control: while the menu is open it morphs
     into an X in place (upper right) — matches the homepage menu. */
  .m-burger.is-open span:nth-child(1) {
    transform: translateY(4px) rotate(45deg);
  }
  .m-burger.is-open span:nth-child(2) {
    transform: translateY(-4px) rotate(-45deg);
  }

  /* Keep the nav ABOVE the overlay on mobile so the wordmark stays visible
     in the upper-left and the burger/X stays tappable in the upper-right
     while the menu is open. Desktop nav z-index (50) is unchanged. */
  .nav { z-index: 410; }

  /* ===============================================================
     MOBILE MENU — matches the homepage (index.html) exactly:
       z-390  .m-veil   frosts/blurs the page behind it with a light tint
       z-395  .m-menu   the links, over the blur
       z-410  .nav      wordmark + burger/X stay on top (above)
     The burger morphs into an X to close; the menu also closes on a link
     tap, an empty-space tap, or Escape.
     =============================================================== */
  .m-veil {
    display: block;
    position: fixed; inset: 0;
    z-index: 390;
    background: rgba(10, 9, 8, 0.42);
    -webkit-backdrop-filter: blur(22px) saturate(1.05);
    backdrop-filter: blur(22px) saturate(1.05);
    opacity: 0; pointer-events: none;
    transition: opacity 420ms cubic-bezier(.22,.61,.36,1);
  }
  .m-veil.open { opacity: 1; }

  .m-menu {
    display: block;
    position: fixed; inset: 0;
    z-index: 395;
    background: transparent;
    opacity: 0; pointer-events: none;
    transition: opacity 360ms cubic-bezier(.22,.61,.36,1);
  }
  .m-menu.open { opacity: 1; pointer-events: auto; }
  .m-menu-links {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(24px, 5.5vh, 44px);
  }
  .m-menu-links a {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: clamp(32px, 9vw, 48px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
    color: #EDE6D8;
    text-shadow: 0 1px 3px rgba(0,0,0,0.55), 0 2px 22px rgba(0,0,0,0.45);
    text-decoration: none;
    transition: color 200ms ease;
  }
  .m-menu-links a:active { color: #fff; }
}

/* ===================================================================
   GLOBAL SEE-THROUGH TEXT — every piece of text uses white +
   mix-blend-mode: difference so it reads over any background,
   identical to the homepage intro wordmark. Applied site-wide,
   including the contact details and form fields.
=================================================================== */
.brand, .brand-name,
.menu-flat, .menu-flat-link, .menu-flat-link:hover, .menu-flat-link.is-current,
.menu-flat-sep,
.panel-role, .details a, .details span,
.reach-label, .reach-field input, .reach-field textarea,
.reach-send, .reach-status {
  color: #fff !important;
  mix-blend-mode: difference !important;
}
.reach-field input::placeholder,
.reach-field textarea::placeholder {
  color: #fff !important;
  opacity: 0.55 !important;
}
/* ===================================================================
   BLEND ARCHITECTURE FIX — where mix-blend-mode: difference must be
   applied to actually invert against the page.

   The see-through effect only works when the blended element is in
   (or composites against) the ROOT stacking context. Applying it to
   a child inside an isolated stacking context blends against that
   parent's background (transparent) instead of the page — so the text
   just stays white, with no inversion.

   .nav is position:fixed → root stacking context. Applying the blend
   to .nav itself makes its white content invert against the page.
   Children inside .nav must be reset to normal so they don't double-blend
   against the nav's transparent background before the nav composites.
=================================================================== */
.nav {
  mix-blend-mode: difference;
}
.nav .brand-name,
.nav .brand-mono,
.nav .brand-sub-dot,
.nav .menu-flat,
.nav .menu-flat-link,
.nav .menu-flat-link:hover,
.nav .menu-flat-link.is-current,
.nav .menu-flat-sep,
.nav .m-burger,
.nav .m-burger span {
  mix-blend-mode: normal !important;
}

/* Same architecture for the page content: .contact-main composites as
   one group against the page, so its white text inverts to dark on the
   white background (and stays light over any darker media). Children
   paint normally so they don't double-blend within the group. */
.contact-main { mix-blend-mode: difference; }
.contact-main .panel-role,
.contact-main .details .loc,
.contact-main .details a,
.contact-main .reach-label,
.contact-main .reach-field input,
.contact-main .reach-field textarea,
.contact-main .reach-send,
.contact-main .reach-status {
  mix-blend-mode: normal !important;
}

</style>

</head>
<body>



<main class="contact-main">
  <div class="stage">

    <div class="panel">
      <div class="details">
        <span class="loc">Los Angeles, California</span>
        <a class="email" href="mailto:heymikebecker@gmail.com">heymikebecker@gmail.com</a>
        <a class="tel" href="tel:+14107071596">410.707.1596</a>
      </div>
      <h1 class="panel-role">Hey Mike,</h1>
      <div class="reach">
        <form id="reachForm">
          <input type="hidden" name="access_key" value="5cbb2f65-1dbf-47d7-88ed-4a7197711492">
          <input type="hidden" name="subject" value="New message from your website">
          <input type="hidden" name="from_name" value="Mike Becker Website">
          <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
          <div class="reach-field">
            <input type="text" name="name" placeholder="My name is" required autocomplete="name">
          </div>
          <div class="reach-field">
            <input type="email" name="email" placeholder="My email is" required autocomplete="email">
          </div>
          <div class="reach-field">
            <textarea name="message" placeholder="I would love to tell you about" required rows="1"></textarea>
          </div>
          <button type="submit" class="reach-send" id="reachSend">
            <span class="label">Send</span>
            <span class="arrow">&rarr;</span>
          </button>
          <p class="reach-status" id="reachStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

  </div>
</main>

<script>
// Load-in
window.addEventListener('DOMContentLoaded', function() {
  requestAnimationFrame(function() { document.body.classList.add('is-loaded'); });
});

// Portrait + bio reveal on cursor proximity (in addition to :hover)
(function() {
  var figure = document.getElementById('figure');
  if (!figure) return;
  if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;
  window.addEventListener('mousemove', function(e) {
    var r = figure.getBoundingClientRect();
    var dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    var dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 160) figure.classList.add('is-near');
    else figure.classList.remove('is-near');
  }, { passive: true });
})();

// Auto-grow textarea
(function() {
  var ta = document.querySelector('#reachForm textarea[name="message"]');
  if (!ta) return;
  ta.addEventListener('input', function() {
    ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
  });
})();

// Form submit to Web3Forms
(function() {
  var form = document.getElementById('reachForm');
  var status = document.getElementById('reachStatus');
  var sendBtn = document.getElementById('reachSend');
  if (!form) return;
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    status.className = 'reach-status show'; status.textContent = 'Sending…';
    sendBtn.disabled = true;
    try {
      var data = new FormData(form);
      var res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: data });
      var json = await res.json();
      if (json.success) {
        status.className = 'reach-status show';
        status.textContent = "Thanks — your message is on its way. I'll be in touch.";
        form.reset();
        var ta = form.querySelector('textarea'); if (ta) ta.style.height = 'auto';
      } else { throw new Error(json.message || 'failed'); }
    } catch (err) {
      status.className = 'reach-status show error';
      status.textContent = "Something went wrong. Please email heymikebecker@gmail.com directly.";
    } finally { sendBtn.disabled = false; }
  });
})();
</script>

<script>
/* Mobile overlay menu — matches the homepage (index.html): the burger
   opens a full-screen overlay over a frosted veil and morphs into an X to
   close. Closes on a link tap, an empty-space tap, or Escape. */
(function () {
  function initMenu() {
    var burger = document.querySelector('.m-burger');
    var menu = document.getElementById('mMenu');
    if (!burger || !menu) return;
    var veil = document.getElementById('mVeil');
    var links = menu.querySelectorAll('.m-menu-links a');

    function openMenu() {
      menu.classList.add('open');
      if (veil) veil.classList.add('open');
      burger.classList.add('is-open');
      burger.setAttribute('aria-expanded', 'true');
      burger.setAttribute('aria-label', 'Close menu');
      menu.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      menu.classList.remove('open');
      if (veil) veil.classList.remove('open');
      burger.classList.remove('is-open');
      burger.setAttribute('aria-expanded', 'false');
      burger.setAttribute('aria-label', 'Open menu');
      menu.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    function toggleMenu() {
      if (menu.classList.contains('open')) closeMenu();
      else openMenu();
    }
    burger.addEventListener('click', toggleMenu);
    // Tap on empty overlay space (not a link) closes the menu.
    menu.addEventListener('click', function (e) {
      if (e.target === menu || e.target.classList.contains('m-menu-links')) closeMenu();
    });
    for (var i = 0; i < links.length; i++) links[i].addEventListener('click', closeMenu);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && menu.classList.contains('open')) closeMenu();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMenu);
  } else {
    initMenu();
  }
})();
</script>
